name: Auto-PC Work (Dev_UI)

env:
  PRODUCT_NAME: "로그캐치"
  TEST_TYPE: Dev_UI
  TZ: Asia/Seoul

on:
  push:
    branches: [ "master" ]
  schedule:
    - cron: '5 2 * * *'
  # 👇 수동 배포 및 테스트 트리거
  workflow_dispatch:

jobs:
  # ====================================================
  # [Job 1] QA 리눅스 서버(Hyper-V)에 최신 버전 배포 (딱 1번만 실행)
  # ====================================================
  deploy-qa:
    runs-on: [self-hosted, PC-Auto]
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Latest Build File
        run: |
          $deployFolder = "C:\Auto_Deploy"
          if (!(Test-Path $deployFolder)) { Write-Error "❌ $deployFolder 폴더를 찾을 수 없습니다."; exit 1 }
          
          $latestFile = Get-ChildItem -Path $deployFolder -Filter "*.bin" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (!$latestFile) { Write-Error "❌ $deployFolder 폴더에 .bin 파일이 없습니다!"; exit 1 }
          
          Write-Host "🚀 발견된 최신 빌드 파일: $($latestFile.FullName)"
          echo "BIN_FILE_PATH=$($latestFile.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "BIN_FILE_NAME=$($latestFile.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Native SSH & SCP Deploy
        env:
          SSH_KEY_DATA: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # 1. 임시 키 파일 생성 (인코딩 및 줄바꿈 최적화)
          $keyPath = "$env:TEMP\id_auto"
          
          # Secret 데이터를 불러와서 양 끝의 공백을 제거하고 UTF8(BOM없음)로 저장
          $trimmedKey = $env:SSH_KEY_DATA.Trim()
          [System.IO.File]::WriteAllLines($keyPath, $trimmedKey)
          
          # 2. 정보 설정
          $target = "${{ secrets.QA_SERVER_USER }}@${{ secrets.QA_SERVER_IP }}"
          $remotePath = "/home/${{ secrets.QA_SERVER_USER }}/deploy"
          $localFile = "${env:BIN_FILE_PATH}"
          $fileName = "${env:BIN_FILE_NAME}"
          
          # 3. SSH 옵션 정의
          $sshOpts = "-o BatchMode=yes -o StrictHostKeyChecking=no -i $keyPath"

          Write-Host "🚀 [1단계] 리눅스 서버에 접속하여 폴더를 생성합니다..."
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i $keyPath $target "mkdir -p $remotePath"

          Write-Host "📂 [2단계] 파일을 전송(SCP)합니다..."
          scp -o BatchMode=yes -o StrictHostKeyChecking=no -i $keyPath $localFile "${target}:${remotePath}/"

          Write-Host "✅ [3단계] 서버 설치 명령어를 실행합니다..."
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i $keyPath $target "chmod +x $remotePath/$fileName && $remotePath/$fileName -b -f"

          # 4. 보안을 위해 임시 키 파일 삭제
          if (Test-Path $keyPath) { Remove-Item -Path $keyPath -Force }
          
          Write-Host "✨ 모든 배포 작업 완료! 1분간 기동을 기다립니다..."
          Start-Sleep -Seconds 60

  # ====================================================
  # [Job 2] 테스트 실행 (Runner 5개 병렬 구동)
  # ====================================================
  cypress-run:
    needs: deploy-qa # 👇 [핵심] deploy-qa 작업이 완전히 끝난 후에만 실행되도록 설정
    runs-on: [self-hosted, PC-Auto]
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2, 3, 4, 5]

    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean Previous Reports
        run: |
          Remove-Item -Path "cypress/reports" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "cypress/screenshots" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "cypress/videos" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Get Current Time
        run: echo "NOW=$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create Dummy Report File
        run: |
          $dir = "cypress/reports/json_logs"
          if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Force -Path $dir }
          $suiteUUID = [guid]::NewGuid().ToString()
          $testUUID  = [guid]::NewGuid().ToString()
          
          $dummyContent = @"
          {
            "stats": { "suites": 1, "tests": 1, "passes": 1, "pending": 0, "failures": 0, "start": "2024-01-01T00:00:00.000Z", "end": "2024-01-01T00:00:01.000Z", "duration": 100, "testsRegistered": 1, "passPercent": 100, "pendingPercent": 0, "other": 0, "hasOther": false, "skipped": 0, "hasSkipped": false },
            "results": [ { "uuid": "$suiteUUID", "title": "System Check", "fullFile": "", "file": "", "beforeHooks": [], "afterHooks": [], "tests": [ { "title": "Report Placeholder", "fullTitle": "System Check Report Placeholder", "timedOut": false, "duration": 100, "state": "passed", "speed": "fast", "pass": true, "fail": false, "pending": false, "context": null, "code": "true", "err": {}, "uuid": "$testUUID", "parentUUID": "$suiteUUID", "isHook": false, "skipped": false } ], "suites": [], "passes": ["$testUUID"], "failures": [], "pending": [], "skipped": [], "duration": 100, "root": false, "rootEmpty": false, "_timeout": 2000 } ],
            "meta": { "mocha": { "version": "7.0.0" }, "mochawesome": { "options": { "quiet": false, "reportFilename": "mochawesome", "saveHtml": false, "saveJson": true, "consoleReporter": "spec", "useInlineDiffs": false, "code": true }, "version": "7.1.3" }, "marge": { "options": { "reportDir": "cypress/reports/json_logs", "overwrite": false, "html": false, "json": true }, "version": "6.2.0" } }
          }
          "@
          $dummyContent | Out-File -FilePath "$dir/dummy.json" -Encoding UTF8

      - name: Cypress Run
        id: cypress
        env:
          # 👇 [수정됨] Cypress가 방금 배포된 Hyper-V 리눅스 서버를 타겟으로 하도록 변경
          CYPRESS_BASE_URL: "https://10.10.54.51:18443/logcatch"
          CYPRESS_API_URL: "http://10.10.54.5:1234/"
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_INFO_MESSAGE: ${{ github.event.head_commit.message }}
          NO_COLOR: 1
          CI: true
        continue-on-error: true
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          
          npm install
          npm install cy2 mochawesome mochawesome-merge mochawesome-report-generator --save-dev
          npx cypress install

          cmd /c "chcp 65001 & npx cy2 run --record --spec 'cypress/e2e/UI_Module_Full_Check/**/*.cy.js' --browser chrome --parallel --ci-build-id ${{ github.ref_name }}-${{ github.run_id }}-UI 2>&1" | Out-File -FilePath cypress.log -Encoding UTF8

          Get-Content cypress.log

      - name: Extract Dashboard URL
        if: always()
        run: |
          $logPath = "cypress.log"
          if (Test-Path $logPath) {
            $content = Get-Content $logPath -Raw -Encoding UTF8
            if ($content -match "(/run/[a-zA-Z0-9-]+)") {
                $runPath = $matches[1]
                $realUrl = "http://10.10.54.5:8080$runPath"
                Write-Host "✅ 대시보드 URL 생성 완료: $realUrl"
                echo $realUrl | Out-File -FilePath run_url.txt -Encoding UTF8
            } else {
                Write-Host "⚠️ 로그에서 Run ID를 찾을 수 없습니다."
                echo "http://10.10.54.5:8080/projects" | Out-File -FilePath run_url.txt -Encoding UTF8
            }
          } else { Write-Host "❌ cypress.log 파일이 없습니다." }

      - name: Upload URL File
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-url-${{ matrix.containers }}
          path: run_url.txt
          retention-days: 1
          if-no-files-found: ignore

      - name: 📂 리포트 데이터 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UI-Raw-Data-${{ matrix.containers }}
          path: |
            cypress/reports/json_logs
            cypress/screenshots
          retention-days: 1
          if-no-files-found: ignore

  # ====================================================
  # [Job 3] 종합 알림 (데이터 통합 & 리포트 생성)
  # ====================================================
  notify-result:
    needs: cypress-run
    if: always()
    runs-on: [self-hosted, PC-Auto]
    
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      - name: 🧹 기존 데이터 청소 (Clean Workspace)
        run: |
          Write-Host "이전 작업의 잔여 데이터를 삭제합니다..."
          Remove-Item -Path "all_raw_data" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "final_report_UI" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "downloaded_url" -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Clear Finish!"

      - name: Get Current Time
        run: echo "NOW=$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download Dashboard URL
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: dashboard-url-*
          merge-multiple: true
          path: downloaded_url

      - name: Download All Raw Data
        uses: actions/download-artifact@v4
        with:
          pattern: UI-Raw-Data-*
          path: all_raw_data
          merge-multiple: true
          
      - name: 🔍 파일 구조 확인
        run: Get-ChildItem -Path all_raw_data -Recurse       

      - name: 🔄 리포트 하나로 통합하기
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          npm install mochawesome-merge mochawesome-report-generator --no-save
          cmd /c "npx mochawesome-merge all_raw_data/**/*.json > merged_report.json"
          npx marge merged_report.json --reportDir ./final_report_UI --inline --charts --reportTitle "UI Check Report" --reportFilename "LogCatch_UI_Report" --saveJson=false

      - name: Send Google Chat (UI)
        if: always() 
        env:
          JOB_STATUS: ${{ needs.cypress-run.result }}
          MSG_SUCCESS: "*[성공]*[Auto-PC]"
          MSG_FAIL: "*[실패]*[Auto-PC]"
          MSG_TITLE: "DEV 확인결과"
          LABEL_DASH: "대시보드"
          LABEL_GIT: "GitHub(Report)"
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          
          $jobStatus = "${{ env.JOB_STATUS }}".ToLower()
          $reportFolder = "all_raw_data/reports/json_logs"
          $screenshotPath = "all_raw_data/screenshots"
          
          $isActuallyFailed = $false
          $finalFailCount = 0
          $realFailedSpecs = @()

          if (Test-Path $screenshotPath) {
              $failedScreenshots = Get-ChildItem -Path $screenshotPath -Recurse -Filter "*(failed)*.png"
              if ($failedScreenshots.Count -gt 0) {
                  $isActuallyFailed = $true
                  $potentialFailSpecs = $failedScreenshots | ForEach-Object { Split-Path $_.Directory -Leaf } | Select-Object -Unique
                  
                  if (Test-Path $reportFolder) {
                      foreach ($specName in $potentialFailSpecs) {
                          $isRealFail = $false
                          $relatedReports = Get-ChildItem -Path $reportFolder -Filter "report_*.json"
                          foreach ($report in $relatedReports) {
                              try {
                                  $rawJson = Get-Content $report.FullName -Raw -Encoding UTF8
                                  if ([string]::IsNullOrWhiteSpace($rawJson)) { continue }
                                  $content = $rawJson | ConvertFrom-Json -ErrorAction Stop
                                  if ($content.results[0].fullFile -like "*$specName*" -and [int]$content.stats.failures -gt 0) {
                                      $isRealFail = $true
                                      break
                                  }
                              } catch { continue }
                          }
                          if ($isRealFail) { $realFailedSpecs += $specName }
                      }
                  } else { $realFailedSpecs = $potentialFailSpecs }
              }
          }

          if ($isActuallyFailed) {
              $finalFailCount = $realFailedSpecs.Count
              if ($finalFailCount -eq 0 -and $jobStatus -ne "success") {
                  $finalFailCount = 1
                  $realFailedSpecs = @("Detected by System")
              }
          }

          # 상태 결정
          if ($isActuallyFailed -and $finalFailCount -gt 0) {
              $title = $env:MSG_FAIL
              $fileNameString = if ($realFailedSpecs.Count -gt 0) { $realFailedSpecs -join ", " } else { "Unknown Spec" }
              $statusDetail = "FAIL: $finalFailCount script ( $fileNameString )"
              "FINAL_STATUS=FAIL" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
              $title = $env:MSG_SUCCESS
              $statusDetail = ""
              "FINAL_STATUS=PASS" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

          # 메시지 조립 (Here-String 방식으로 따옴표 에러 방지)
          $pName = $env:PRODUCT_NAME
          $tType = $env:TEST_TYPE
          $mTitle = $env:MSG_TITLE
          $time = $env:NOW
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $url = if (Test-Path "downloaded_url/run_url.txt") { (Get-Content "downloaded_url/run_url.txt" -Raw).Trim() } else { "http://10.10.54.5:8080/projects" }

          # 👇 여기가 에러가 났던 부분입니다. 구조를 완전히 안전하게 바꿨습니다.
          $msgBody = @"
          $title $pName $tType $mTitle ($time)
          $statusDetail

          ${env:LABEL_DASH} : $url
          ${env:LABEL_GIT} : $runUrl
          "@

          $payload = @{ text = $msgBody } | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri '${{ secrets.GOOGLE_CHAT_WEBHOOK }}' -Method Post -ContentType "application/json; charset=utf-8" -Body ([System.Text.Encoding]::UTF8.GetBytes($payload))