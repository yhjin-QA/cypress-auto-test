name: Auto-PC Work (Daily_UI)

env:
  PRODUCT_NAME: "로그캐치"
  TZ: Asia/Seoul

on:
  push:
    branches: [ "master" ]
  schedule:
    - cron: '15 6 * * *' # 매일 아침 수행
  workflow_dispatch:

jobs:
  # ====================================================
  # [Job 1] 테스트 실행 (3명이 일만 수행 - 알림 X)
  # ====================================================
  cypress-run:
    runs-on: [self-hosted, PC-Auto]
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2, 3] # Runner 3대 병렬

    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Current Time
        run: echo "NOW=$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cypress Run
        env:
          CYPRESS_API_URL: "http://10.10.54.5:1234/"
          CYPRESS_RECORD_KEY: "my-secret-key"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_INFO_MESSAGE: ${{ github.event.head_commit.message }}
          NO_COLOR: 1
          CI: true
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          
          npm install
          npm install cy2 cypress-mochawesome-reporter --save-dev
          npx cypress install

          # UI 테스트 실행 (병렬)
          cmd /c "chcp 65001 & npx cy2 run --record --spec 'cypress/e2e/UI_Module_Full_Check/**/*.cy.js' --browser chrome --parallel --ci-build-id ${{ github.ref_name }}-${{ github.run_id }}-UI 2>&1" | Out-File -FilePath cypress.log -Encoding UTF8
          
          Get-Content cypress.log

      - name: 📂 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UI-Report-${{ matrix.containers }} # 파일명 뒤에 번호 붙임
          path: cypress/reports
          retention-days: 30

  # ====================================================
  # [Job 2] 종합 알림 (테스트 완료 후 1번만 실행)
  # ====================================================
  notify-result:
    needs: cypress-run # ⭐ 중요: 위 3개가 다 끝나야 실행
    if: always()
    runs-on: [self-hosted, PC-Auto]
    
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      - name: Get Current Time
        run: echo "NOW=$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Send Google Chat (UI)
        env:
          JOB_STATUS: ${{ needs.cypress-run.result }}
          # 👇 [요청하신 한글 깨짐 방지용 변수 그대로 적용]
          MSG_SUCCESS: "*[성공]*[Auto-PC]"
          MSG_FAIL: "*[실패]*[Auto-PC]"
          MSG_TITLE: "UI 확인결과"
          # 종합 결과이므로 특정 run ID 대신 프로젝트 목록으로 안내
          DASH_BASE: "http://10.10.54.5:8080/projects"
          LABEL_DASH: "대시보드"
          LABEL_GIT: "GitHub(Report)"
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          # 1. 성공/실패 여부에 따라 제목 변수 선택
          if ($env:JOB_STATUS -eq 'success') { 
            $resultTitle = $env:MSG_SUCCESS
          } else { 
            $resultTitle = $env:MSG_FAIL
          }
          
          # 2. 메시지 조립 (한글을 직접 쓰지 않고 $env:변수 사용)
          $message = "$resultTitle $env:PRODUCT_NAME $env:MSG_TITLE ($env:NOW)`n`n${env:LABEL_DASH}: $env:DASH_BASE`n${env:LABEL_GIT}: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          Write-Host "Sending Message: $message"

          # 3. JSON 변환 및 전송
          $payloadJson = (@{ text = $message } | ConvertTo-Json -Compress -Depth 2)
          $payloadBytes = [System.Text.Encoding]::UTF8.GetBytes($payloadJson)
          Invoke-RestMethod -Uri "${{ secrets.GOOGLE_CHAT_WEBHOOK }}" -Method Post -ContentType "application/json; charset=utf-8" -Body $payloadBytes