name: Auto-PC Work (Daily_UI)

env:
  PRODUCT_NAME: "로그캐치"
  TZ: Asia/Seoul

on:
  push:
    branches: [ "master" ]
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

jobs:
  # [Job 1] 테스트 실행 (4병렬)
  cypress-run:
    runs-on: [self-hosted, PC-Auto]
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2, 3, 4] # Runner 4개

    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Current Time
        run: echo "NOW=$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cypress Run
        env:
          CYPRESS_API_URL: "http://10.10.54.5:1234/"
          CYPRESS_RECORD_KEY: "my-secret-key"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_INFO_MESSAGE: ${{ github.event.head_commit.message }}
          NO_COLOR: 1
          CI: true
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          
          npm install
          npm install cy2 cypress-mochawesome-reporter --save-dev
          npx cypress install

          cmd /c "chcp 65001 & npx cy2 run --record --spec 'cypress/e2e/UI_Module_Full_Check/**/*.cy.js' --browser chrome --parallel --ci-build-id ${{ github.ref_name }}-${{ github.run_id }}-UI 2>&1" | Out-File -FilePath cypress.log -Encoding UTF8
          
          Get-Content cypress.log

      # URL 추출 및 저장
      - name: Extract Dashboard URL
        if: always()
        run: |
          $logPath = "cypress.log"
          if (Test-Path $logPath) {
            $content = Get-Content $logPath -Raw -Encoding UTF8
            if ($content -match "/run/(?<id>[a-f0-9]+)") {
                $realRunId = $matches['id']
                $realUrl = "http://10.10.54.5:8080/run/$realRunId"
                echo $realUrl | Out-File -FilePath run_url.txt -Encoding UTF8
            }
          }

      # URL 파일 업로드
      - name: Upload URL File
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-url-${{ matrix.containers }}
          path: run_url.txt
          retention-days: 1

      # 리포트 파일 업로드 (이름: UI-Report-1, UI-Report-2...)
      - name: 📂 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UI-Report-${{ matrix.containers }}
          path: cypress/reports
          retention-days: 30

  # [Job 2] 종합 알림 (파일 첨부 기능 복구)
  notify-result:
    needs: cypress-run
    if: always()
    runs-on: [self-hosted, PC-Auto]
    
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      - name: Get Current Time
        run: echo "NOW=$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # 1. Runner 1번의 URL 파일 다운로드
      - name: Download Dashboard URL
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dashboard-url-1
          path: downloaded_url

      # 👇 [추가됨] 2. 4개의 리포트 파일 모두 다운로드
      - name: Download All Reports
        uses: actions/download-artifact@v4
        with:
          pattern: UI-Report-* # UI-Report로 시작하는 모든 아티팩트 다운로드
          path: all_reports      # 'all_reports' 폴더에 저장
          merge-multiple: false  # 폴더별로 구분해서 저장 (덮어쓰기 방지)

      # 구글 챗 알림
      - name: Send Google Chat (UI)
        env:
          JOB_STATUS: ${{ needs.cypress-run.result }}
          MSG_SUCCESS: "*[성공]*[Auto-PC]"
          MSG_FAIL: "*[실패]*[Auto-PC]"
          MSG_TITLE: "UI 확인결과"
          LABEL_DASH: "대시보드"
          LABEL_GIT: "GitHub(Report)"
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          $urlFile = "downloaded_url/run_url.txt"
          if (Test-Path $urlFile) {
            $realUrl = Get-Content $urlFile -Raw
            $realUrl = $realUrl.Trim()
          } else {
            $realUrl = "http://10.10.54.5:8080/projects"
          }

          if ($env:JOB_STATUS -eq 'success') { $resultTitle = $env:MSG_SUCCESS } else { $resultTitle = $env:MSG_FAIL }
          
          $message = "$resultTitle $env:PRODUCT_NAME $env:MSG_TITLE ($env:NOW)`n`n${env:LABEL_DASH}: $realUrl`n${env:LABEL_GIT}: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          $payloadJson = (@{ text = $message } | ConvertTo-Json -Compress -Depth 2)
          $payloadBytes = [System.Text.Encoding]::UTF8.GetBytes($payloadJson)
          Invoke-RestMethod -Uri "${{ secrets.GOOGLE_CHAT_WEBHOOK }}" -Method Post -ContentType "application/json; charset=utf-8" -Body $payloadBytes

      # 이메일 발송 (파일 첨부 복구!)
      - name: 🚨 실패 시 팀원 전체에게 긴급 메일 발송
        if: needs.cypress-run.result == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 🚨 [종합/실패][UI] Cypress UI 테스트 실패 알림
          to: yhjin@warevalley.com
          from: Cypress 알림 봇 <noreply@warevalley.com>
          
          # 👇 [복구됨] 다운로드 받은 폴더 안의 모든 html 파일을 첨부합니다.
          # Runner가 4개이므로, 메일에 파일 4개가 첨부될 것입니다.
          attachments: all_reports/**/*.html
          
          body: |
            [긴급] Auto-PC에서 수행된 로그캐치 UI 자동화 테스트가 실패했습니다.
            (Runner 4대의 리포트 파일이 모두 첨부되었습니다.)
            
            ---------------------------------------------------

            발생 시간: ${{ env.NOW }}
            상태: ❌ FAILED
            👉 상세 리포트 (GitHub): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            ---------------------------------------------------