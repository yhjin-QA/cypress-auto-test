name: Auto-PC Work (Daily)

env:
  PRODUCT_NAME: "로그캐치"
  TZ: Asia/Seoul

on:
  push:
    branches: [ "master" ]
  schedule:
    - cron: '15 6 * * *' # 매일 아침 6:15
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: [self-hosted, PC-Auto]
    
    # 👇 [핵심 추가] 병렬 실행을 위한 전략 설정
    strategy:
      fail-fast: false # 하나가 실패해도 나머지 Runner들은 끝까지 테스트를 수행함
      matrix:
        containers: [1, 2, 3] # Runner 개수만큼 숫자 지정 (3개면 1, 2, 3)

    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 한국 시간 구해서 환경변수(NOW)에 저장
      - name: Get Current Time (KST)
        run: |
          $korea_time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          echo "NOW=$korea_time" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      
      # 2. Cypress 실행
      - name: Cypress Run (Self-Hosted Dashboard)
        env:
          CYPRESS_API_URL: "http://10.10.54.5:1234/"
          CYPRESS_RECORD_KEY: "my-secret-key"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_INFO_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_INFO_AUTHOR: ${{ github.actor }}
          COMMIT_INFO_SHA: ${{ github.sha }}
          COMMIT_INFO_BRANCH: ${{ github.ref_name }}
          NO_COLOR: 1           
          FORCE_COLOR: 0        
          TERM: dumb            
          CI: true
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          # 1. 패키지 설치
          npm install
          npm install cy2 --save-dev
          npm install cypress-mochawesome-reporter --save-dev
          npx cypress install

          # 2. 테스트 실행 (병렬 옵션은 이미 잘 들어가 있습니다)
          # --ci-build-id가 동일해야 3개의 러너가 "우린 한 팀이야"라고 인식합니다.
          # matrix 구조에서는 github.run_id가 동일하므로 잘 동작합니다.
          cmd /c "chcp 65001 & npx cy2 run --record --spec cypress/e2e/UI_Module_Full_Check/**/*.cy.js --browser chrome --parallel --ci-build-id ${{ github.ref_name }}-${{ github.run_id }}-UI 2>&1" | Out-File -FilePath cypress.log -Encoding UTF8
          
          Get-Content cypress.log -Encoding UTF8
          Get-Content cypress.log

      # 3. 진짜 대시보드 URL 추출
      - name: Extract Real Dashboard URL
        if: always() 
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          $logPath = "cypress.log"
          if (Test-Path $logPath) {
            $content = Get-Content $logPath -Raw -Encoding UTF8
            if ($content -match "/run/(?<id>[a-f0-9]+)") {
                $realRunId = $matches['id']
                $realUrl = "http://10.10.54.5:8080/run/$realRunId"
                
                echo "REAL_DASHBOARD_URL=$realUrl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                Write-Host "DashBoard URL! -> $realUrl"
            } else {
                Write-Host "Log Analysis Result: ID pattern (/run/xxxx) was not found."
            }
          }

      # 👇 [수정] 리포트 이름 겹침 방지
      # 병렬로 돌면 3명이 동시에 업로드하므로 이름을 구분해줍니다.
      - name: 📂 테스트 리포트 업로드 (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cypress-Report-HTML-${{ matrix.containers }} # 뒤에 번호 붙임 (1, 2, 3)
          path: cypress/reports
          retention-days: 30      
      
      # 4. 구글 챗 알림 전송
      - name: Send Google Chat Notification
        if: always()
        env:
          MSG_SUCCESS: "*[성공]*[Auto-PC-${{ matrix.containers }}]" # 몇 번 러너인지 표시
          MSG_FAIL: "*[실패]*[Auto-PC-${{ matrix.containers }}]"
          MSG_TITLE: "UI 확인결과"
          DASH_BASE: "http://10.10.54.5:8080"
          LABEL_DASH: "대시보드"
          LABEL_GIT: "GitHub(Report)"
          REAL_URL: ${{ env.REAL_DASHBOARD_URL }}
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          if ("${{ job.status }}" -eq 'success') { 
            $resultTitle = $env:MSG_SUCCESS
          } else { 
            $resultTitle = $env:MSG_FAIL
          }
          
          if ($env:REAL_URL) {
            $dashboardUrl = $env:REAL_URL
          } else {
            $dashboardUrl = "http://10.10.54.5:8080/projects"
          }

          $message = "$resultTitle $env:PRODUCT_NAME $env:MSG_TITLE ($env:NOW)`n`n${env:LABEL_DASH}: $dashboardUrl`n${env:LABEL_GIT}: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          $payloadJson = (@{ text = $message } | ConvertTo-Json -Compress -Depth 2)
          $payloadBytes = [System.Text.Encoding]::UTF8.GetBytes($payloadJson)

          Invoke-RestMethod -Uri "${{ secrets.GOOGLE_CHAT_WEBHOOK }}" -Method Post -ContentType "application/json; charset=utf-8" -Body $payloadBytes

      # 5. 이메일 발송
      - name: 🚨 실패 시 팀원 전체에게 긴급 메일 발송
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 🚨 [긴급/실패][Auto-PC-${{ matrix.containers }}] Cypress UI 테스트 실패
          to: yhjin@warevalley.com
          from: Cypress 알림 봇 <noreply@warevalley.com>
          attachments: cypress/reports/html/index.html
          body: |
            [긴급] Auto-PC (Runner-${{ matrix.containers }})에서 수행된 테스트가 실패했습니다.
            
            ---------------------------------------------------
            발생 시간: ${{ env.NOW }}
            상태: ❌ FAILED
            Runner: PC-Auto-${{ matrix.containers }}
            대시보드: ${{ env.REAL_DASHBOARD_URL }}
            ---------------------------------------------------