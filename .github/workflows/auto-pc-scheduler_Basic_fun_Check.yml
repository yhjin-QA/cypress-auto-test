name: Auto-PC Work (Daily_Basic)

env:
  PRODUCT_NAME: "로그캐치"
  TZ: Asia/Seoul

on:
  push:
    branches: [ "master" ]
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

jobs:
  # ====================================================
  # [Job 1] 테스트 실행 (Runner 4명 병렬)
  # ====================================================
  cypress-run:
    runs-on: [self-hosted, PC-Auto]
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2, 3, 4] # Runner 4개

    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Current Time
        run: echo "NOW=$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cypress Run
        env:
          CYPRESS_API_URL: "http://10.10.54.5:1234/"
          CYPRESS_RECORD_KEY: "my-secret-key"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_INFO_MESSAGE: ${{ github.event.head_commit.message }}
          NO_COLOR: 1
          CI: true
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          
          npm install
          npm install cy2 cypress-mochawesome-reporter --save-dev
          npx cypress install

          cmd /c "chcp 65001 & npx cy2 run --record --spec 'cypress/e2e/Basic_functions_check/**/*.cy.js' --browser chrome --parallel --ci-build-id ${{ github.ref_name }}-${{ github.run_id }}-Basic 2>&1" | Out-File -FilePath cypress.log -Encoding UTF8
          
          Get-Content cypress.log

      # URL 추출 및 저장
      - name: Extract Dashboard URL
        if: always()
        run: |
          $logPath = "cypress.log"
          if (Test-Path $logPath) {
            $content = Get-Content $logPath -Raw -Encoding UTF8
            if ($content -match "/run/(?<id>[a-f0-9]+)") {
                $realRunId = $matches['id']
                $realUrl = "http://10.10.54.5:8080/run/$realRunId"
                echo $realUrl | Out-File -FilePath run_url.txt -Encoding UTF8
            }
          }

      # URL 파일 업로드
      - name: Upload URL File
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-url-${{ matrix.containers }}
          path: run_url.txt
          retention-days: 1

      # 👇 [핵심 변경] HTML 대신 'Raw 데이터(.json)'와 '스크린샷'을 업로드합니다.
      # 나중에 이걸 하나로 합치기 위함입니다.
      - name: 📂 리포트 데이터 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Basic-Raw-Data-${{ matrix.containers }}
          path: |
            cypress/reports/html/.jsons
            cypress/screenshots
          retention-days: 1

  # ====================================================
  # [Job 2] 종합 알림 (리포트 통합 & 1회 발송)
  # ====================================================
  notify-result:
    needs: cypress-run
    if: always()
    runs-on: [self-hosted, PC-Auto]
    
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      - name: Get Current Time
        run: echo "NOW=$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # 1. 대시보드 URL 파일 다운로드
      - name: Download Dashboard URL
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dashboard-url-1
          path: downloaded_url

      # 👇 2. 4개의 Raw 데이터(JSON+이미지) 모두 다운로드 및 병합
      - name: Download All Raw Data
        uses: actions/download-artifact@v4
        with:
          pattern: Basic-Raw-Data-* 
          path: all_raw_data      
          merge-multiple: true 

      # 👇 3. 데이터 합치기 & HTML 생성 (Merge & Generate)
      - name: 🔄 리포트 하나로 통합하기
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          # 1. 병합 도구 설치 (가볍게 설치)
          npm install mochawesome-merge mochawesome-report-generator --no-save

          # 2. JSON 파일 하나로 합치기 (PowerShell 인코딩 문제 방지를 위해 cmd /c 사용)
          # all_raw_data 폴더 안의 모든 json을 찾아서 merged_report.json으로 만듭니다.
          cmd /c "npx mochawesome-merge all_raw_data/*.json > merged_report.json"
          
          # 3. 합쳐진 JSON으로 '최종 HTML' 생성
          # --inline: CSS/JS를 HTML 안에 넣기
          # --charts: 차트 포함
          npx marge merged_report.json --reportDir ./final_report --inline --charts --reportTitle "Basic 기능 통합 리포트" --saveJson=false

      # 4. 구글 챗 알림
      - name: Send Google Chat (Basic)
        env:
          JOB_STATUS: ${{ needs.cypress-run.result }}
          MSG_SUCCESS: "*[성공]*[Auto-PC]"
          MSG_FAIL: "*[실패]*[Auto-PC]"
          MSG_TITLE: "기능(Basic) 시나리오 확인결과"
          LABEL_DASH: "대시보드"
          LABEL_GIT: "GitHub(Report)"
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          $urlFile = "downloaded_url/run_url.txt"
          if (Test-Path $urlFile) {
            $realUrl = Get-Content $urlFile -Raw
            $realUrl = $realUrl.Trim()
          } else {
            $realUrl = "http://10.10.54.5:8080/projects"
          }

          if ($env:JOB_STATUS -eq 'success') { $resultTitle = $env:MSG_SUCCESS } else { $resultTitle = $env:MSG_FAIL }
          
          $message = "$resultTitle $env:PRODUCT_NAME $env:MSG_TITLE ($env:NOW)`n`n${env:LABEL_DASH}: $realUrl`n${env:LABEL_GIT}: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          $payloadJson = (@{ text = $message } | ConvertTo-Json -Compress -Depth 2)
          $payloadBytes = [System.Text.Encoding]::UTF8.GetBytes($payloadJson)
          Invoke-RestMethod -Uri "${{ secrets.GOOGLE_CHAT_WEBHOOK }}" -Method Post -ContentType "application/json; charset=utf-8" -Body $payloadBytes

      # 5. 이메일 알림 (통합된 파일 1개 첨부)
      - name: 🚨 실패 시 팀원 전체에게 긴급 메일 발송
        if: needs.cypress-run.result == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 🚨 [종합/실패][Basic] Cypress 기능 테스트 실패 알림
          to: yhjin@warevalley.com
          from: Cypress 알림 봇 <noreply@warevalley.com>
          
          # 👇 [수정됨] 이제 딱 1개의 파일만 첨부됩니다!
          attachments: final_report/merged_report.html

          body: |
            [긴급] Auto-PC에서 수행된 로그캐치 [Basic 기능] 자동화 테스트가 실패했습니다.
            (4개의 Runner 결과를 하나로 합친 통합 리포트가 첨부되었습니다.)
            
            ---------------------------------------------------
            발생 시간: ${{ env.NOW }}
            상태: ❌ FAILED
            👉 상세 리포트 (GitHub): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            ---------------------------------------------------