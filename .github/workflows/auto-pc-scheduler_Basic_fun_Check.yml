name: Auto-PC Work (Daily_Basic)

env:
  PRODUCT_NAME: "로그캐치"
  #실패시 파일명 독립적으로 UI/basic 명시하기위해 꼬리표
  TEST_TYPE: 기능(Basic)
  TZ: Asia/Seoul
  # [추가] 재시작 테스트 파일 경로 변수화 (관리 편의성) 아래 해당파일은 맨마지막에 수행하도록 
  RESTART_SPEC: "cypress/e2e/Basic_functions_check/**/11_Basic_운영_태스크_spec.cy.js"

on:
  push:
    branches: [ "master" ]
  schedule:
    - cron: '45 2 * * *'
  workflow_dispatch:

jobs:
  # ====================================================
  # [Job 1] 테스트 실행 (Runner)
  # ====================================================
  cypress-run:
    runs-on: [self-hosted, PC-Auto]
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2, 3, 4, 5] # 5병렬 runner추가

    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

        # 👇 [추가] 이전 테스트 결과 찌꺼기(HTML 등) 삭제
      - name: Clean Previous Reports
        run: | 
          Remove-Item -Path "cypress/reports" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "cypress/screenshots" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "cypress/videos" -Recurse -Force -ErrorAction SilentlyContinue


      - name: Get Current Time
        run: echo "NOW=$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # 👇 [안전장치] 파일이 없어서 에러나는 것 방지용 빈 파일 생성
      - name: Create Dummy Report File
        run: |
          # 👇 경로를 config와 맞춤
          $dir = "cypress/reports/json_logs"
          if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Force -Path $dir }
          # 👇 [핵심 수정] 가짜 문자열 대신 '진짜 UUID'를 생성합니다.
          $suiteUUID = [guid]::NewGuid().ToString()
          $testUUID  = [guid]::NewGuid().ToString()
          
          # 리포트 생성기가 좋아하는 완벽한 데이터 구조
          $dummyContent = @"
          {
            "stats": {
              "suites": 1,
              "tests": 1,
              "passes": 1,
              "pending": 0,
              "failures": 0,
              "start": "2024-01-01T00:00:00.000Z",
              "end": "2024-01-01T00:00:01.000Z",
              "duration": 100,
              "testsRegistered": 1,
              "passPercent": 100,
              "pendingPercent": 0,
              "other": 0,
              "hasOther": false,
              "skipped": 0,
              "hasSkipped": false
            },
            "results": [
              {
                "uuid": "$suiteUUID",
                "title": "System Check",
                "fullFile": "",
                "file": "",
                "beforeHooks": [],
                "afterHooks": [],
                "tests": [
                  {
                    "title": "Report Placeholder",
                    "fullTitle": "System Check Report Placeholder",
                    "timedOut": false,
                    "duration": 100,
                    "state": "passed",
                    "speed": "fast",
                    "pass": true,
                    "fail": false,
                    "pending": false,
                    "context": null,
                    "code": "true",
                    "err": {},
                    "uuid": "$testUUID",
                    "parentUUID": "$suiteUUID",
                    "isHook": false,
                    "skipped": false
                  }
                ],
                "suites": [],
                "passes": ["$testUUID"],
                "failures": [],
                "pending": [],
                "skipped": [],
                "duration": 100,
                "root": false,
                "rootEmpty": false,
                "_timeout": 2000
              }
            ],
            "meta": {
              "mocha": { "version": "7.0.0" },
              "mochawesome": {
                "options": {
                  "quiet": false,
                  "reportFilename": "mochawesome",
                  "saveHtml": false,
                  "saveJson": true,
                  "consoleReporter": "spec",
                  "useInlineDiffs": false,
                  "code": true
                },
                "version": "7.1.3"
              },
              "marge": {
                "options": {
                  "reportDir": "cypress/reports/json_logs",
                  "overwrite": false,
                  "html": false,
                  "json": true
                },
                "version": "6.2.0"
              }
            }
          }
          "@
          
          $dummyContent | Out-File -FilePath "$dir/dummy.json" -Encoding UTF8
         
         
          

      - name: Cypress Run
        id: cypress
        env:
          CYPRESS_API_URL: "http://10.10.54.5:1234/"
          CYPRESS_RECORD_KEY: "my-secret-key"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_INFO_MESSAGE: ${{ github.event.head_commit.message }}
          NO_COLOR: 1
          CI: true
        continue-on-error: true # 에러가 나도 업로드는 해야 함
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          # [핵심] 11번 파일을 실행 경로 밖으로 잠시 옮깁니다.
          $restartFile = "${{ env.RESTART_SPEC }}"
          if (Test-Path $restartFile) {
              Move-Item -Path $restartFile -Destination ".." # 한 단계 위 폴더로 이동
              Write-Host "✅ 태스크 재시작 파일을 격리했습니다: $restartFile"
          }
          
          npm install
          npm install cy2 mochawesome mochawesome-merge mochawesome-report-generator --save-dev
          npx cypress install

          # 👇 [수정] 복잡한 옵션은 다 빼고, config 파일 설정을 따르도록 단순화했습니다.
          cmd /c "chcp 65001 & npx cy2 run --record --spec 'cypress/e2e/Basic_functions_check/**/*.cy.js' --browser chrome --parallel --ci-build-id ${{ github.ref_name }}-${{ github.run_id }}-Basic 2>&1" | Out-File -FilePath cypress.log -Encoding UTF8
          
          
          Get-Content cypress.log

      - name: Extract Dashboard URL
        if: always()
        run: |
          $logPath = "cypress.log"

          if (Test-Path $logPath) {
            # 로그 파일 전체 내용을 읽어옵니다.
            $content = Get-Content $logPath -Raw -Encoding UTF8
            
            # 👇 [최적화] 전체 URL이 아니라, 변하지 않는 뒷부분 "/run/ID" 패턴만 찾습니다.
            # (ID에 알파벳, 숫자, 하이픈(-)이 섞여 있어도 다 찾아냅니다)
            if ($content -match "(/run/[a-zA-Z0-9-]+)") {
                $runPath = $matches[1]  # 예: /run/fd8ece14f001...
                
                # 👇 앞부분은 우리가 원하는 '진짜 IP'로 고정해서 붙입니다.
                $realUrl = "http://10.10.54.5:8080$runPath"
                
                Write-Host "✅ 대시보드 URL 생성 완료: $realUrl"
                echo $realUrl | Out-File -FilePath run_url.txt -Encoding UTF8
            } else {
                Write-Host "⚠️ 로그에서 Run ID를 찾을 수 없습니다."
                # 실패 시 프로젝트 목록 페이지로 안내
                echo "http://10.10.54.5:8080/projects" | Out-File -FilePath run_url.txt -Encoding UTF8
            }
          } else {
             Write-Host "❌ cypress.log 파일이 없습니다."
          }

      - name: Upload URL File
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-url-${{ matrix.containers }}
          path: run_url.txt
          retention-days: 1
          if-no-files-found: ignore

      # 👇 [수정됨] 경로를 'cypress/reports' 전체로 변경하여 파일 누락 방지
      - name: 📂 리포트 데이터 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Basic-Raw-Data-${{ matrix.containers }}
          path: |
            cypress/reports/json_logs
            cypress/screenshots
          retention-days: 1
          if-no-files-found: ignore
  
  # ====================================================
  # [Job 2] 태스크 재시작 테스트 (단독 실행)
  # ====================================================
  restart-task-run:
    needs: cypress-run  # Job 1이 끝나야 시작
    if: always()        
    runs-on: [self-hosted, PC-Auto]
    # 👇 [추가] cy2 실행을 위한 환경 변수 복사
    env:
      CYPRESS_API_URL: "http://10.10.54.5:1234/"
      CYPRESS_RECORD_KEY: "my-secret-key"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COMMIT_INFO_MESSAGE: ${{ github.event.head_commit.message }}
      NO_COLOR: 1
      CI: true
      continue-on-error: true # 에러가 나도 업로드는 해야 함
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress Run (Restart Task Spec)
        run: |
         
          $ErrorActionPreference = "Continue" 
          npm install --no-audit  
          npx cypress install

          # 특정 파일 단독 실행
          # 환경변수 누락 에러 해결을 위해 env가 위쪽에 선언되었는지 꼭 확인하세요!
          cmd /c "chcp 65001 & npx cy2 run --record --spec '${{ env.RESTART_SPEC }}' --browser chrome --ci-build-id ${{ github.ref_name }}-${{ github.run_id }}-Basic 2>&1" | Out-File -FilePath cypress_restart.log -Encoding UTF8
          Get-Content cypress_restart.log

          Get-Content cypress_restart.log
          
      - name: 📂 리포트 데이터 업로드 (Restart Spec)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Basic-Raw-Data-Restart
          path: |
            cypress/reports/json_logs
            cypress/screenshots
          retention-days: 1       

  # ====================================================
  # [Job 3] 종합 알림 (데이터 통합 & 리포트 생성)
  # ====================================================
  notify-result:
    #needs: cypress-run
    needs: [cypress-run, restart-task-run] # 두 작업이 모두 끝나야 함
    if: always()
    runs-on: [self-hosted, PC-Auto]
    
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      # 👇 [필수 추가] 이 단계가 없으면 이전 테스트 결과(Basic)와 현재 결과(UI)가 뒤섞입니다!
      - name: 🧹 기존 데이터 청소 (Clean Workspace)
        run: |
          Write-Host "이전 작업의 잔여 데이터를 삭제합니다..."
          Remove-Item -Path "all_raw_data" -Recurse -Force -ErrorAction SilentlyContinue
          # 👇 [수정] final_report_Basic 폴더를 청소
          Remove-Item -Path "final_report_Basic" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "downloaded_url" -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Clear Finish!"

      - name: Get Current Time
        run: echo "NOW=$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download Dashboard URL
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: dashboard-url-* # 1, 2, 3번 모두 찾음
          merge-multiple: true     # 파일 이름이 같으므로(run_url.txt) 하나로 합쳐짐 (덮어쓰기)
          path: downloaded_url

      # 모든 Raw 데이터 다운로드
      - name: Download All Raw Data
        uses: actions/download-artifact@v4
        with:
          pattern: Basic-Raw-Data-*
          path: all_raw_data
          merge-multiple: true

      # 👇 [추가됨] 파일이 진짜 있는지 눈으로 확인 (디버깅용)
      - name: 🔍 파일 구조 확인
        run: Get-ChildItem -Path all_raw_data -Recurse    

      # 👇 [통합 로직] 폴더 구조가 바뀌어도 찾을 수 있게 **/*.json 사용
      - name: 🔄 리포트 하나로 통합하기
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          npm install mochawesome-merge mochawesome-report-generator --no-save

          # 1. JSON 파일 병합 (가장 넓은 범위로 탐색)
          cmd /c "npx mochawesome-merge all_raw_data/**/*.json > merged_report.json"
          
          # 2. HTML 생성
          # 여기에 --reportFilename "LogCatch_Basic_fun_Report" 추가
          npx marge merged_report.json --reportDir ./final_report_Basic --inline --charts --reportTitle "Basic Function Report" --reportFilename "LogCatch_Basic_fun_Report" --saveJson=false

      - name: Send Google Chat (Basic)
        if: always() 
        env:
          # Job 1의 결과를 확인
          JOB_STATUS: ${{ needs.cypress-run.result }}
          MSG_SUCCESS: "*[성공]*[Auto-PC]"
          MSG_FAIL: "*[실패]*[Auto-PC]"
          MSG_TITLE: "시나리오 확인결과"
          LABEL_DASH: "대시보드"
          LABEL_GIT: "GitHub(Report)"
         

        run: |
          # 1. 인코딩 설정 (UTF8)
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          
          $jobStatus = "${{ env.JOB_STATUS }}".ToLower()
          $reportFolder = "all_raw_data/reports/json_logs"
          $screenshotPath = "all_raw_data/screenshots"
          
          $isActuallyFailed = $false
          $finalFailCount = 0
          $realFailedSpecs = @()

          # [1단계] 스크린샷 기반 실패 감지
          if (Test-Path $screenshotPath) {
              $failedScreenshots = Get-ChildItem -Path $screenshotPath -Recurse -Filter "*(failed)*.png"
              if ($failedScreenshots.Count -gt 0) {
                  $isActuallyFailed = $true
                  $potentialFailSpecs = $failedScreenshots | ForEach-Object { Split-Path $_.Directory -Leaf } | Select-Object -Unique
                  
                  # [2단계] 리포트 검증 (Flaky 필터링)
                  if (Test-Path $reportFolder) {
                      foreach ($specName in $potentialFailSpecs) {
                          $isRealFail = $false
                          $relatedReports = Get-ChildItem -Path $reportFolder -Filter "report_*.json"
                          
                          foreach ($report in $relatedReports) {
                              try {
                                  # -Encoding UTF8 추가 및 에러 발생 시 건너뛰기
                                  $rawJson = Get-Content $report.FullName -Raw -Encoding UTF8
                                  if ([string]::IsNullOrWhiteSpace($rawJson)) { continue }
                                  
                                  $content = $rawJson | ConvertFrom-Json -ErrorAction Stop
                                  
                                  # 리포트에서 실패 여부 확인
                                  if ($content.results[0].fullFile -like "*$specName*" -and [int]$content.stats.failures -gt 0) {
                                      $isRealFail = $true
                                      break
                                  }
                              } catch {
                                  # JSON 파싱 에러 발생 시 무시하고 다음 파일 확인
                                  continue
                              }
                          }
                          if ($isRealFail) { $realFailedSpecs += $specName }
                      }
                  } else {
                      $realFailedSpecs = $potentialFailSpecs
                  }
              }
          }

          # [3단계] 최종 판정 및 숫자 보정
          if ($isActuallyFailed) {
              $finalFailCount = $realFailedSpecs.Count
              if ($finalFailCount -eq 0 -and $jobStatus -ne "success") {
                  $finalFailCount = 1
                  $realFailedSpecs = @("Detected by System")
              }
          }

          # 4. 최종 상태 결정 및 특정 단어만 강조(*) 적용
          if ($isActuallyFailed -and $finalFailCount -gt 0) {
              # 제목의 [실패] 부분만 강조
              $title = $env:MSG_FAIL.Replace("[실패]", "*[실패]*")
              
              $fileNameString = if ($realFailedSpecs.Count -gt 0) { $realFailedSpecs -join ", " } else { "Unknown Spec" }
              
              # 요청 사항: FAIL 라인의 강조(*) 제거
              $statusDetail = "FAIL: $finalFailCount script ( $fileNameString )"
              
              "FINAL_STATUS=FAIL" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
              # 제목의 [성공] 부분만 강조
              $title = $env:MSG_SUCCESS.Replace("[성공]", "*[성공]*")
              $statusDetail = ""
              "FINAL_STATUS=PASS" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

          # 5. 메시지 전송 로직
          $pName = $env:PRODUCT_NAME; $tType = $env:TEST_TYPE; $mTitle = $env:MSG_TITLE; $time = $env:NOW
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $url = if (Test-Path "downloaded_url/run_url.txt") { (Get-Content "downloaded_url/run_url.txt" -Raw).Trim() } else { "http://10.10.54.5:8080/projects" }
          
          $msgText = if ($statusDetail -ne "") { "$title $pName $tType $mTitle ($time)`n$statusDetail`n`n${env:LABEL_DASH} : $url`n${env:LABEL_GIT} : $runUrl" } 
                     else { "$title $pName $tType $mTitle ($time)`n`n${env:LABEL_DASH} : $url`n${env:LABEL_GIT} : $runUrl" }

          $body = @{ text = $msgText } | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri '${{ secrets.GOOGLE_CHAT_WEBHOOK }}' -Method Post -ContentType "application/json; charset=utf-8" -Body ([System.Text.Encoding]::UTF8.GetBytes($body))

      - name: 🚨 실패 시 팀원 전체에게 긴급 메일 발송
        if: always() && env.FINAL_STATUS == 'FAIL'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 🚨 [실패][Basic] LogCatch 기능 테스트 실패 알림
          to: yhjin@warevalley.com
          from: Cypress 알림 봇 <noreply@warevalley.com>
          
         # 👇 [수정 2] 첨부 파일 경로를 Basic_Report.html로 변경
          attachments: final_report_Basic/LogCatch_Basic_fun_Report.html

          body: |
            [긴급] Auto-PC에서 수행된 로그캐치 [Basic 기능] 자동화 테스트가 실패했습니다.
            (통합된 리포트가 첨부되었습니다.)
            
            ---------------------------------------------------
            발생 시간: ${{ env.NOW }}
            상태: ❌ FAILED
            👉 상세 리포트 (GitHub): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            ---------------------------------------------------
            담당자분들은 위 링크를 클릭하여 실패 원인을 확인해 주세요.