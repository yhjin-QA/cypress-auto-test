name: Auto-PC Work (Daily_LogCatch_Basic)

env:
  PRODUCT_NAME: "로그캐치"
  TZ: Asia/Seoul

on:
  push:
    branches: [ "master" ]
  schedule:
    - cron: '15 2 * * *' # 매일
  workflow_dispatch:

jobs:
  # [Job 1] 테스트 실행 (3명이 일만 열심히 함 - 알림 안 보냄)
  cypress-run:
    runs-on: [self-hosted, PC-Auto]
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2, 3] # 3개 병렬 실행

    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Current Time (KST)
        run: |
          $korea_time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          echo "NOW=$korea_time" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cypress Run (Self-Hosted Dashboard)
        env:
          CYPRESS_API_URL: "http://10.10.54.5:1234/"
          CYPRESS_RECORD_KEY: "my-secret-key"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_INFO_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_INFO_AUTHOR: ${{ github.actor }}
          COMMIT_INFO_SHA: ${{ github.sha }}
          COMMIT_INFO_BRANCH: ${{ github.ref_name }}
          NO_COLOR: 1           
          FORCE_COLOR: 0        
          TERM: dumb            
          CI: true
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          
          npm install
          npm install cy2 --save-dev
          npm install cypress-mochawesome-reporter --save-dev
          npx cypress install
          
          # 테스트 실행
          cmd /c "chcp 65001 & npx cy2 run --record --spec 'cypress/e2e/Basic_functions_check/**/*.cy.js' --browser chrome --parallel --ci-build-id ${{ github.ref_name }}-${{ github.run_id }}-Basic 2>&1" | Out-File -FilePath cypress.log -Encoding UTF8
          
          Get-Content cypress.log

      # 리포트 업로드 (파일명 겹침 방지를 위해 번호 붙임)
      - name: 📂 테스트 리포트 업로드 (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Cypress-Report-HTML-${{ matrix.containers }} # 👈 중요: 파일명 뒤에 1,2,3 번호 붙임
          path: cypress/reports
          retention-days: 30

  # [Job 2] 종합 알림 (테스트가 다 끝나면 1번만 실행됨)
  notify-result:
    needs: cypress-run # ⭐ 중요: cypress-run 3개가 다 끝나야 실행
    if: always()       # 실패해도 알림은 보냄
    runs-on: [self-hosted, PC-Auto] # Runner 아무나 하나 잡아서 실행
    
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      - name: Get Current Time (KST)
        run: |
          $korea_time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          echo "NOW=$korea_time" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # 구글 챗 알림 (한글 깨짐 방지 완벽 적용)
      - name: Send Google Chat Notification
        env:
          # needs.cypress-run.result가 'success'면 전체 성공, 아니면 실패
          JOB_STATUS: ${{ needs.cypress-run.result }}
          PRODUCT_NAME: "로그캐치"
          MSG_TITLE: "기능(Basic) 시나리오 최종 결과"
        run: |
          # 1. 인코딩 설정 (사용자님이 작성하신 코드 적용)
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          # 2. 성공/실패 여부 판단
          if ($env:JOB_STATUS -eq 'success') { 
            $resultTitle = "*[전체 성공]* 🟢"
          } else { 
            $resultTitle = "*[일부 실패]* 🔴"
          }
          
          # 3. 메시지 본문 작성
          # (종합 결과이므로 개별 URL 대신 전체 프로젝트 목록 링크 제공)
          $dashboardUrl = "http://10.10.54.5:8080/projects"
          $githubUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          $message = "$resultTitle $env:PRODUCT_NAME $env:MSG_TITLE ($env:NOW)`n`n📊 대시보드: $dashboardUrl`n📝 상세리포트: $githubUrl"
          
          Write-Host "Create Message: $message"
          
          # 4. JSON 변환 및 Byte 배열 처리 (한글 깨짐 해결의 핵심!)
          $payloadJson = (@{ text = $message } | ConvertTo-Json -Compress -Depth 2)
          $payloadBytes = [System.Text.Encoding]::UTF8.GetBytes($payloadJson)

          # 5. 전송
          Invoke-RestMethod -Uri "${{ secrets.GOOGLE_CHAT_WEBHOOK }}" -Method Post -ContentType "application/json; charset=utf-8" -Body $payloadBytes

      # 이메일 알림 (실패했을 때만 발송)
      - name: 🚨 실패 시 팀원 전체에게 긴급 메일 발송
        if: needs.cypress-run.result == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 🚨 [종합/실패][Basic] Cypress 기능 테스트 실패 알림
          to: yhjin@warevalley.com
          from: Cypress 알림 봇 <noreply@warevalley.com>
          body: |
            [종합 알림] 로그캐치 Basic 기능 테스트 중 일부가 실패했습니다.
            
            ---------------------------------------------------
            발생 시간: ${{ env.NOW }}
            상태: ❌ 최종 실패 (Some checks failed)
            
            👉 결과 확인 (GitHub Actions):
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            ---------------------------------------------------