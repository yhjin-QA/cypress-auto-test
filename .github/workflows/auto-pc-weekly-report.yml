name: 주간 테스트 트렌드 리포트

env:
  PRODUCT_NAME: "로그캐치"
  TZ: Asia/Seoul
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 0 * * 1'   # 매주 월요일 09:00 KST (UTC 00:00)
  workflow_dispatch:
    inputs:
      weeks:
        description: '조회할 주 수 (기본 4)'
        required: false
        default: '4'

jobs:
  # ============================================================
  # 주간 리포트 생성 및 발송
  # ============================================================
  weekly-report:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── GitHub API로 최근 워크플로우 실행 이력 조회 ─────────────
      - name: Collect Workflow Run History
        id: history
        uses: actions/github-script@v7
        with:
          script: |
            const weeks   = parseInt('${{ github.event.inputs.weeks || 4 }}');
            const sinceMs = weeks * 7 * 24 * 60 * 60 * 1000;
            const since   = new Date(Date.now() - sinceMs).toISOString();

            // 모니터링할 워크플로우 목록
            const targets = [
              { name: 'DEV_RELEASE_Check', file: 'auto-pc-scheduler_DEV_RELEASE_Check.yml' },
              { name: 'DEV_ALPHA_Check',   file: 'auto-pc-scheduler_DEV_ALPHA_Check.yml'   },
              { name: 'Depth_fun_Check',   file: 'auto-pc-scheduler_Depth_fun_Check.yml'   },
              { name: 'Basic_fun_Check',   file: 'auto-pc-scheduler_Basic_fun_Check.yml'   },
              { name: 'UI_Check',          file: 'auto-pc-scheduler_UI Check.yml'          },
              { name: 'Performance',       file: 'auto-pc-scheduler_Performance.yml'       },
            ];

            const result = {};

            for (const t of targets) {
              try {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner:       context.repo.owner,
                  repo:        context.repo.repo,
                  workflow_id: t.file,
                  per_page:    30,
                  created:     `>=${since}`,
                });

                const runs = (data.workflow_runs || []).map(r => ({
                  id:          r.id,
                  status:      r.status,
                  conclusion:  r.conclusion,
                  created_at:  r.created_at,
                  html_url:    r.html_url,
                  run_number:  r.run_number,
                }));

                const total    = runs.length;
                const success  = runs.filter(r => r.conclusion === 'success').length;
                const failure  = runs.filter(r => r.conclusion === 'failure').length;
                const skipped  = runs.filter(r => r.conclusion === 'skipped').length;
                const passRate = total > 0 ? Math.round((success / total) * 100) : null;
                const lastRun  = runs[0] || null;

                result[t.name] = { total, success, failure, skipped, passRate, lastRun, runs };
              } catch (e) {
                console.warn(`⚠️  ${t.name} 조회 실패: ${e.message}`);
                result[t.name] = { total: 0, success: 0, failure: 0, skipped: 0, passRate: null, lastRun: null, runs: [] };
              }
            }

            core.setOutput('data', JSON.stringify(result));
            console.log('✅ 이력 조회 완료');

      # ── HTML 리포트 생성 ─────────────────────────────────────────
      - name: Generate Weekly HTML Report
        id: gen
        run: |
          node - << 'SCRIPT'
          const fs   = require('fs');
          const data = JSON.parse(process.env.HISTORY_DATA);
          const now  = new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' });
          const weeks = parseInt(process.env.WEEKS || '4');

          function esc(s) {
            return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          }

          // 워크플로우별 요약 행 생성
          function conclusionBadge(c) {
            const map = {
              success: ['#27AE60','✅ 성공'],
              failure: ['#E74C3C','❌ 실패'],
              skipped: ['#95A5A6','⏭ 스킵'],
              cancelled:['#F39C12','⚠ 취소'],
            };
            const [color, label] = map[c] || ['#BDC3C7','— 없음'];
            return `<span style="background:${color};color:white;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold;">${label}</span>`;
          }

          let tableRows = '';
          let totalRuns = 0, totalSuccess = 0, totalFailure = 0;
          let wfSummary = [];

          for (const [name, d] of Object.entries(data)) {
            totalRuns    += d.total;
            totalSuccess += d.success;
            totalFailure += d.failure;

            const rateColor = d.passRate === null ? '#BDC3C7'
              : d.passRate >= 90 ? '#27AE60'
              : d.passRate >= 70 ? '#F39C12'
              : '#E74C3C';

            const lastInfo = d.lastRun
              ? `<a href="${esc(d.lastRun.html_url)}" target="_blank" style="color:#2980B9;text-decoration:none;">#${d.lastRun.run_number}</a>`
              : '—';
            const lastDate = d.lastRun
              ? new Date(d.lastRun.created_at).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}).slice(0,16)
              : '—';
            const lastConclusion = d.lastRun ? conclusionBadge(d.lastRun.conclusion) : '—';

            // 미니 트렌드 바 (최근 10회)
            const recent = (d.runs || []).slice(0, 10).reverse();
            const bars = recent.map(r => {
              const c = r.conclusion === 'success' ? '#27AE60'
                      : r.conclusion === 'failure' ? '#E74C3C'
                      : '#BDC3C7';
              return `<span title="${r.conclusion}" style="display:inline-block;width:10px;height:20px;background:${c};margin:1px;border-radius:2px;"></span>`;
            }).join('');

            const rateStr = d.passRate !== null ? `${d.passRate}%` : 'N/A';

            tableRows += `
              <tr>
                <td style="font-weight:bold;">${esc(name)}</td>
                <td style="text-align:center;">${d.total}</td>
                <td style="text-align:center;color:#27AE60;font-weight:bold;">${d.success}</td>
                <td style="text-align:center;color:#E74C3C;font-weight:bold;">${d.failure}</td>
                <td style="text-align:center;"><span style="font-weight:bold;color:${rateColor};">${rateStr}</span></td>
                <td style="text-align:center;">${bars || '<span style="color:#ccc;">—</span>'}</td>
                <td style="text-align:center;">${lastConclusion}</td>
                <td style="text-align:center;">${lastInfo}</td>
                <td style="color:#888;font-size:11px;">${lastDate}</td>
              </tr>`;

            wfSummary.push({ name, passRate: d.passRate, total: d.total, failure: d.failure });
          }

          // 전체 통과율
          const overallRate = totalRuns > 0 ? Math.round((totalSuccess / totalRuns) * 100) : 0;
          const overallColor = overallRate >= 90 ? '#27AE60' : overallRate >= 70 ? '#F39C12' : '#E74C3C';
          const statusEmoji  = overallRate >= 90 ? '🟢' : overallRate >= 70 ? '🟡' : '🔴';

          // 워크플로우별 통과율 바 차트 (SVG)
          const chartW = 500, barH = 22, gapY = 8;
          const svgH = wfSummary.length * (barH + gapY) + 10;
          const maxW = chartW - 180;
          let svgBars = '';
          wfSummary.forEach((w, i) => {
            const y = i * (barH + gapY) + 4;
            const pct = w.passRate !== null ? w.passRate : 0;
            const bw = Math.max(2, pct / 100 * maxW);
            const color = pct >= 90 ? '#27AE60' : pct >= 70 ? '#F39C12' : '#E74C3C';
            const label = w.passRate !== null ? `${pct}%` : 'N/A';
            svgBars += `
              <text x="0" y="${y + barH - 5}" font-size="11" fill="#555" font-family="sans-serif">${esc(w.name)}</text>
              <rect x="155" y="${y}" width="${bw}" height="${barH}" rx="3" fill="${color}" opacity="0.85"/>
              <text x="${155 + bw + 6}" y="${y + barH - 5}" font-size="11" fill="${color}" font-weight="bold" font-family="sans-serif">${label}</text>`;
          });

          const html = \`<!DOCTYPE html>

          <html lang="ko">

          <head>

          <meta charset="UTF-8">

          <title>로그캐치 주간 테스트 리포트</title>

          <style>

          * { box-sizing:border-box; margin:0; padding:0; }

          body { font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif; background:#F4F6F9; color:#2C3E50; }

          .header { background:linear-gradient(135deg,#1F5C99 0%,#2980B9 100%); color:white; padding:24px 32px; }

          .header h1 { font-size:22px; margin-bottom:4px; }

          .header .meta { font-size:13px; opacity:.85; }

          .big-rate { font-size:48px; font-weight:bold; color:white; }

          .container { max-width:960px; margin:24px auto; padding:0 16px; }

          .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }

          .card { background:white; border-radius:10px; padding:16px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.07); }

          .card .num { font-size:26px; font-weight:bold; }

          .card .lbl { font-size:11px; color:#888; margin-top:4px; }

          .section { background:white; border-radius:10px; padding:20px 24px; margin-bottom:20px; box-shadow:0 2px 8px rgba(0,0,0,.07); }

          .section h2 { font-size:15px; color:#1F5C99; border-bottom:2px solid #D5E8F0; padding-bottom:8px; margin-bottom:16px; }

          table { width:100%; border-collapse:collapse; font-size:12px; }

          th { background:#1F5C99; color:white; padding:9px 10px; text-align:left; }

          td { padding:8px 10px; border-bottom:1px solid #ECF0F1; vertical-align:middle; }

          tr:last-child td { border-bottom:none; }

          tr:hover td { background:#F8FAFB; }

          .footer { text-align:center; font-size:11px; color:#AAA; padding:20px; }

          </style>

          </head>

          <body>

          <div class="header">

          <h1>${statusEmoji} 로그캐치 주간 테스트 트렌드 리포트</h1>

          <div class="meta">집계 기간: 최근 ${weeks}주 &nbsp;|&nbsp; 생성: \${now}</div>

          <div style="margin-top:12px;">

          <span class="big-rate" style="color:\${overallColor};">\${overallRate}%</span>

          <span style="font-size:14px;margin-left:8px;opacity:.9;">전체 통과율 (\${totalSuccess}/\${totalRuns}회 성공)</span>

          </div>

          </div>



          <div class="container">

          <div class="cards">

          <div class="card"><div class="num" style="color:#2980B9;">\${totalRuns}</div><div class="lbl">총 실행 횟수</div></div>

          <div class="card"><div class="num" style="color:#27AE60;">\${totalSuccess}</div><div class="lbl">✅ 성공</div></div>

          <div class="card"><div class="num" style="color:#E74C3C;">\${totalFailure}</div><div class="lbl">❌ 실패</div></div>

          <div class="card"><div class="num" style="color:#8E44AD;">\${overallRate}%</div><div class="lbl">📈 통과율</div></div>

          </div>


          <div class="section">

          <h2>📊 워크플로우별 통과율</h2>

          <svg width="${chartW}" height="\${svgH}" viewBox="0 0 ${chartW} \${svgH}">

          \${svgBars}

          </svg>

          </div>


          <div class="section">

          <h2>📋 워크플로우별 상세 현황</h2>

          <table>

          <thead>

          <tr>

          <th>워크플로우</th><th>실행</th><th>성공</th><th>실패</th>

          <th>통과율</th><th>트렌드 (최근10)</th><th>최근 결과</th><th>Run#</th><th>최근 실행일</th>

          </tr>

          </thead>

          <tbody>\${tableRows}</tbody>

          </table>

          </div>

          </div>


          <div class="footer">

          🤖 Auto-generated by LogCatch Cypress CI/CD &nbsp;|&nbsp;

          <a href="https://github.com/\${{ github.repository }}/actions" style="color:#2980B9;">GitHub Actions</a>

          </div>

          </body>

          </html>\`;


          fs.mkdirSync('reports', { recursive: true });

          fs.writeFileSync('reports/weekly-report.html', html, 'utf8');


          // Google Chat 메시지용 간단 요약
          const chatMsg = [
            \`[주간리포트][Auto-PC] 로그캐치 테스트 트렌드 (최근 \${weeks}주)\`,
            \`📊 전체 통과율: \${overallRate}% (\${totalSuccess}/\${totalRuns}회)\`,
            ...wfSummary.map(w => {
              const icon = w.passRate >= 90 ? '🟢' : w.passRate >= 70 ? '🟡' : w.passRate !== null ? '🔴' : '⚪';
              return \`  \${icon} \${w.name}: \${w.passRate !== null ? w.passRate+'%' : 'N/A'} (\${w.total}회 실행)\`;
            }),
            \`🔗 https://github.com/\${{ github.repository }}/actions/runs/\${{ github.run_id }}\`,
          ].join('\n');

          fs.writeFileSync('reports/chat-message.txt', chatMsg, 'utf8');
          console.log('✅ HTML 리포트 생성 완료: reports/weekly-report.html');
          SCRIPT
        env:
          HISTORY_DATA: ${{ steps.history.outputs.data }}
          WEEKS: ${{ github.event.inputs.weeks || 4 }}

      # ── Google Chat 발송 ─────────────────────────────────────────
      - name: Send Google Chat Summary
        run: |
          MSG=$(cat reports/chat-message.txt)
          BODY=$(echo "{\"text\": \"$MSG\"}" | python3 -c "
          import sys, json
          txt = open('reports/chat-message.txt', encoding='utf-8').read()
          print(json.dumps({'text': txt}))
          ")
          curl -s -X POST '${{ secrets.GOOGLE_CHAT_WEBHOOK }}' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$BODY"
          echo "✅ Google Chat 발송 완료"

      # ── 이메일 발송 (HTML 리포트 첨부) ──────────────────────────
      - name: Send Email Report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port:    465
          secure:         true
          username:       ${{ secrets.MAIL_USERNAME }}
          password:       ${{ secrets.MAIL_PASSWORD }}
          subject:        "[주간리포트][Auto-PC] 로그캐치 테스트 트렌드 — ${{ github.run_number }}회"
          to:             ${{ secrets.MAIL_USERNAME }}
          from:           "LogCatch CI <${{ secrets.MAIL_USERNAME }}>"
          html_body:      file://reports/weekly-report.html
          attachments:    reports/weekly-report.html

      # ── 리포트 아티팩트 보존 ─────────────────────────────────────
      - name: Upload Weekly Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Weekly-Report-${{ github.run_number }}
          path: reports/weekly-report.html
          retention-days: 30
