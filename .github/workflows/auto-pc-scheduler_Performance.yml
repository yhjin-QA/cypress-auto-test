name: Auto-PC Work (Performance)

env:
  PRODUCT_NAME: "로그캐치"
  TEST_TYPE: 성능(Performance)
  TZ: Asia/Seoul

on:
  push:
    branches: [ "master" ]
  schedule:
    - cron: '5 4 * * 1-5'
  workflow_dispatch:

jobs:
  # ====================================================
  # [Job 1] 성능 테스트 실행 (2병렬 러너)
  # ====================================================
  performance-run:
    runs-on: [self-hosted, PC-Auto]
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2] # 기존과 동일하게 5병렬 유지 (2개 파일이 자동으로 분배됨)

    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

        # 👇 패키지 설치 단계 추가
      - name: Install Dependencies
        run: |
          npm install --no-audit  
          npx cypress install

      - name: Clean Previous Reports
        run: | 
          Remove-Item -Path "cypress/reports" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "cypress/screenshots" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Get Current Time
        run: echo "NOW=$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cypress Run (Performance)
        env:
          CYPRESS_API_URL: "http://10.10.54.5:1234/"
          CYPRESS_RECORD_KEY: "my-secret-key"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_COLOR: 1
          CI: true
        continue-on-error: true
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          
          # 👇 [디버깅용 추가] 실제로 러너가 파일을 잘 인식하는지 화면에 출력해봅니다.
          Write-Host "🔍 [Check] 파일 목록을 확인합니다:"
          Get-ChildItem -Path "cypress/e2e/Performance" -ErrorAction SilentlyContinue | Select-Object Name

          Write-Host "🚀 [Job 1] Performance 폴더의 As-is / To-be 성능 테스트를 실행합니다."

          # 👇 [핵심 해결] 
          # 1. 작은따옴표(') 대신 이스케이프된 큰따옴표(`") 사용 (공백 인식 문제 해결)
          # 2. **/*.cy.js 대신 폴더 경로만 깔끔하게 지정하여 내부의 모든 테스트를 실행하도록 변경
          cmd /c "chcp 65001 & npx cy2 run --record --spec `"cypress/e2e/Performance`" --browser chrome --parallel --group `"Performance-Tests`" --ci-build-id ${{ github.ref_name }}-${{ github.run_id }}-Performance 2>&1" | Out-File -FilePath cypress.log -Encoding UTF8

       
          Get-Content cypress.log

     # 👇 [신규 추가] 생성된 리포트 파일명을 분석해서 이 컨테이너가 어떤 IP를 측정했는지 알아냅니다.
      - name: 🔍 측정 대상 IP 추출
        if: always()
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          
          $targetIp = "Unknown"
          
          # 리포트 폴더가 정상적으로 생성되었는지 확인
          if (Test-Path "cypress/reports/lighthouse") {
              # 폴더 안의 모든 html 파일 이름을 하나의 문자열로 합칩니다.
              $fileNames = (Get-ChildItem -Path "cypress/reports/lighthouse" -Filter "*.html").Name -join " "
              
              # 파일명 안에 '41'이 포함되어 있다면 To-be 서버로 판단
              if ($fileNames -match "41") {
                  $targetIp = "10.10.54.41"
              } 
              # 파일명 안에 '42'가 포함되어 있다면 As-is 서버로 판단
              elseif ($fileNames -match "42") {
                  $targetIp = "10.10.54.42"
              }
          }
          
          Write-Host "✅ 이 컨테이너에서 측정한 IP: $targetIp"
          
          # 다음 스텝에서 쓸 수 있도록 환경 변수(TARGET_IP)에 저장합니다.
          "TARGET_IP=$targetIp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # 👇 [수정됨] matrix.containers 대신 방금 추출한 TARGET_IP 변수를 이름에 사용합니다.
      - name: 📊 Upload Lighthouse Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lighthouse-Performance-Report-${{ env.TARGET_IP }}
          path: cypress/reports/lighthouse
          retention-days: 7
          if-no-files-found: ignore

  # ====================================================
  # [Job 2] 구글 챗 알림 전송 (테스트 종료 후)
  # ====================================================
  notify-result:
    needs: [performance-run] # 5병렬 테스트가 모두 종료되면 실행
    if: always()
    runs-on: [self-hosted, PC-Auto]
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"
    steps:
      - name: Get Current Time
        run: echo "NOW=$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        
      - name: Send Google Chat (Performance)
        env:
          MSG_TITLE: "[성능][웹페이지로딩][Auto-PC] 로그캐치 웹페이지 로딩측정결과"
          MSG_TOBE: "10.10.54.41 (to-be) :"
          MSG_ASIS: "10.10.54.42 (as-is) :"
          MSG_DESC: "측정결과 : 해당 링크의 Artifacts 다운로드 압축 파일을 확인해주세요"
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          
          # 👇 [핵심 추가] 현재 시간을 스텝 내부에서 직접 추출하여 변수에 담습니다.
          $nowTime = Get-Date -Format 'yyyy-MM-dd HH:mm:ss'
          
          # GitHub Artifacts (리포트 파일)를 다운받을 수 있는 해당 Action Run의 고유 링크
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          # 👇 변수가 꼬이지 않도록 $($변수명) 형태로 안전하게 감싸서 조립합니다.
          $msgText = "$($env:MSG_TITLE) ($nowTime)`n$($env:MSG_TOBE) $runUrl`n$($env:MSG_ASIS) $runUrl`n$($env:MSG_DESC)"

          $body = @{ text = $msgText } | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri '${{ secrets.GOOGLE_CHAT_WEBHOOK }}' -Method Post -ContentType "application/json; charset=utf-8" -Body ([System.Text.Encoding]::UTF8.GetBytes($body))