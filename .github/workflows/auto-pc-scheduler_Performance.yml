name: Auto-PC Work (Performance)

env:
  PRODUCT_NAME: "로그캐치"
  TEST_TYPE: 성능(Performance)
  TZ: Asia/Seoul

on:
  push:
    branches: [ "master" ]
  schedule:
    - cron: '5 4 * * 1-5'
  workflow_dispatch:

jobs:
  # ====================================================
  # [Job 1] 성능 테스트 실행 (2병렬 러너)
  # ====================================================
  performance-run:
    runs-on: [self-hosted, PC-Auto]
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2] # 기존과 동일하게 5병렬 유지 (2개 파일이 자동으로 분배됨)

    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

        # 👇 패키지 설치 단계 추가
      - name: Install Dependencies
        run: |
          npm install --no-audit  
          npx cypress install

      - name: Clean Previous Reports
        run: | 
          Remove-Item -Path "cypress/reports" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "cypress/screenshots" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Get Current Time
        run: echo "NOW=$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cypress Run (Performance)
        env:
          CYPRESS_API_URL: "http://10.10.54.5:1234/"
          CYPRESS_RECORD_KEY: "my-secret-key"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_COLOR: 1
          CI: true
        continue-on-error: true
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          
          # 👇 [디버깅용 추가] 실제로 러너가 파일을 잘 인식하는지 화면에 출력해봅니다.
          Write-Host "🔍 [Check] 파일 목록을 확인합니다:"
          Get-ChildItem -Path "cypress/e2e/Performance" -ErrorAction SilentlyContinue | Select-Object Name

          Write-Host "🚀 [Job 1] Performance 폴더의 As-is / To-be 성능 테스트를 실행합니다."

          # 👇 [핵심 해결] 
          # 1. 작은따옴표(') 대신 이스케이프된 큰따옴표(`") 사용 (공백 인식 문제 해결)
          # 2. **/*.cy.js 대신 폴더 경로만 깔끔하게 지정하여 내부의 모든 테스트를 실행하도록 변경
          cmd /c "chcp 65001 & npx cy2 run --record --spec `"cypress/e2e/Performance`" --browser chrome --parallel --group `"Performance-Tests`" --ci-build-id ${{ github.ref_name }}-${{ github.run_id }}-Performance 2>&1" | Out-File -FilePath cypress.log -Encoding UTF8

       
          Get-Content cypress.log

     # 👇 [수정됨] 생성된 리포트 파일명을 분석해서 이 컨테이너가 어떤 IP를 측정했는지 알아냅니다.
      - name: 🔍 측정 대상 IP 추출
        if: always()
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          
          $targetIp = "Unknown"
          
          # 리포트 폴더가 정상적으로 생성되었는지 확인
          if (Test-Path "cypress/reports/lighthouse") {
              # 폴더 안의 모든 html 파일 이름을 하나의 문자열로 합칩니다.
              $fileNames = (Get-ChildItem -Path "cypress/reports/lighthouse" -Filter "*.html").Name -join " "
              
              # 👇 [핵심 해결] 날짜/시간(141407 등)과 헷갈리지 않도록 언더바(_)와 하이픈(-)을 포함해 엄격하게 검사합니다.
              if ($fileNames -match "_41-") {
                  $targetIp = "10.10.54.41"
              } 
              elseif ($fileNames -match "_42-") {
                  $targetIp = "10.10.54.42"
              }
          }
          
          Write-Host "✅ 이 컨테이너에서 측정한 IP: $targetIp"
          
          # 다음 스텝에서 쓸 수 있도록 환경 변수(TARGET_IP)에 저장합니다.
          "TARGET_IP=$targetIp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # 👇 [수정됨] matrix.containers 대신 방금 추출한 TARGET_IP 변수를 이름에 사용합니다.
      - name: 📊 Upload Lighthouse Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # 👇 [핵심 해결] 끝에 러너 번호(-1, -2)를 붙여서 409 에러를 완벽하게 차단합니다!
          name: Lighthouse-Performance-Report-${{ env.TARGET_IP }}-${{ matrix.containers }}
          path: cypress/reports/lighthouse
          retention-days: 7
          overwrite: true # 만약 겹치더라도 에러 대신 덮어쓰도록 허용
          if-no-files-found: ignore

 # ====================================================
  # [Job 2] 종합 알림 (구글 챗 전송) 테스트종료후
  # ====================================================
  notify-result:
    needs: [performance-run] 
    if: always()
    runs-on: [self-hosted, PC-Auto]
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"
    steps:
      # 👇 [신규 추가] 점수를 추출하기 위해 방금 업로드된 HTML 리포트들을 임시로 다운로드합니다.
      - name: 📥 Download Lighthouse Reports for Parsing
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: Lighthouse-Performance-Report-*
          path: downloaded_reports

      - name: Send Google Chat (Performance)
        env:
          MSG_TITLE: "[성능][웹페이지로딩][Auto-PC] 로그캐치 웹페이지 로딩측정결과"
          MSG_TOBE: "10.10.54.41 (To-be) :"
          MSG_ASIS: "10.10.54.42 (As-is) :"
          MSG_DESC: "측정결과 : 자세한 세부사항은 해당 링크의 Artifacts의 다운로드 버튼 클릭하여 압축 파일을 확인해주세요"
          MSG_UNKNOWN: "확인 불가"
          MSG_UNIT: "점"
          MSG_AVG: "평균"
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          
          $nowTime = Get-Date -Format 'yyyy-MM-dd HH:mm:ss'
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          # 👇 [수정됨] 흩어진 폴더의 파일들을 모두 모아 가장 최신(시간) 파일 12개만 완벽히 걸러내는 함수
          function Get-AvgScore($ip) {
              $suffix = $ip.Split('.')[-1]
              
              # 1. 해당 IP의 모든 파일을 한 바구니에 담습니다.
              $allFiles = Get-ChildItem -Path "downloaded_reports" -Filter "*_$suffix-*.html" -Recurse -ErrorAction SilentlyContinue
              if (-not $allFiles) { return $env:MSG_UNKNOWN }

              # 2. 가장 최신 파일만 저장할 빈 딕셔너리를 만듭니다. (Key: 메뉴명, Value: 파일객체)
              $latestFiles = @{}

              foreach ($file in $allFiles) {
                  # 파일명에서 '메뉴명' (예: "로그인 전", "이력") 추출
                  $menuName = $file.Name -replace "lighthouse-report-(.*)_$suffix-.*", '$1'
                  
                  # 파일명에서 '시간 문자열' (예: "20260303_144435") 추출
                  $timeStr = ""
                  if ($file.Name -match "_$suffix-(.*)\.html") { $timeStr = $matches[1] }

                  # 3. 딕셔너리에 메뉴가 아예 없거나, 지금 보는 파일의 시간이 기존에 저장된 시간보다 더 최신이면 덮어씁니다!
                  if (-not $latestFiles[$menuName]) {
                      $latestFiles[$menuName] = $file
                  } else {
                      $existingTimeStr = ""
                      if ($latestFiles[$menuName].Name -match "_$suffix-(.*)\.html") { $existingTimeStr = $matches[1] }
                      
                      # 문자열 비교(CompareTo)를 통해 더 큰 값(최신 시간)이면 덮어쓰기
                      if ($timeStr.CompareTo($existingTimeStr) -gt 0) {
                          $latestFiles[$menuName] = $file
                      }
                  }
              }

              # 4. 이제 딕셔너리에는 중복 없이 완벽하게 최신 파일(11~12개)만 남아있습니다. 점수를 뽑아냅니다.
              $scores = @()
              foreach ($file in $latestFiles.Values) {
                  $content = Get-Content $file.FullName -Raw -Encoding UTF8
                  if ($content -match '(?s)"categories"\s*:\s*\{.*?"performance"\s*:\s*\{.*?"score"\s*:\s*([0-9.]+)') {
                      $score = [math]::Round([double]$matches[1] * 100)
                      $scores += $score
                      Write-Host "✅ [$ip] $($file.Name) -> $score$($env:MSG_UNIT)"
                  }
              }

              # 5. 소수점 2자리까지 정확하게 평균 계산
              if ($scores.Count -gt 0) {
                  $avg = [math]::Round(($scores | Measure-Object -Average).Average, 2)
                  Write-Host "🏆 [$ip] 100% 검증된 최종 평균: $avg$($env:MSG_UNIT)"
                  return "$avg$($env:MSG_UNIT)"
              }
              return $env:MSG_UNKNOWN
          }
              
          Write-Host "🔍 점수 추출을 시작합니다..."
          $score41 = Get-AvgScore "10.10.54.41"
          $score42 = Get-AvgScore "10.10.54.42"
          
          $msgText = "$($env:MSG_TITLE) ($nowTime)`n"
          $msgText += "$($env:MSG_TOBE) $($env:MSG_AVG) $score41 | $runUrl`n"
          $msgText += "$($env:MSG_ASIS) $($env:MSG_AVG) $score42 | $runUrl`n"
          $msgText += "$($env:MSG_DESC)"

          $body = @{ text = $msgText } | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri '${{ secrets.GOOGLE_CHAT_WEBHOOK }}' -Method Post -ContentType "application/json; charset=utf-8" -Body ([System.Text.Encoding]::UTF8.GetBytes($body))