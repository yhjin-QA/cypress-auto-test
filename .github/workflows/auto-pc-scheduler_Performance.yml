name: Auto-PC Work (Performance)

env:
  PRODUCT_NAME: "로그캐치"
  TEST_TYPE: 성능(Performance)
  TZ: Asia/Seoul
   # 👇 여기에 추가하세요! (GitHub Actions가 내부적으로 Node.js 24를 사용하도록 강제함)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  

on:
  #push:
  #  branches: [ "master" ]
  #schedule:
  #  - cron: '5 4 * * 1-5'
  workflow_dispatch:

jobs:
  # ====================================================
  # [Phase 1] 쾌적망 (Fast) 성능 테스트 (01, 02 파일 수행)
  # ====================================================
  fast-run:
    runs-on: [self-hosted, PC-Auto]
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2]
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          npm install --no-audit  
          npx cypress install

      - name: Clean Previous Reports
        run: | 
          Remove-Item -Path "cypress/reports" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "cypress/screenshots" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Cypress Run (Fast Mode)
        env:
          CYPRESS_API_URL: "http://10.10.54.5:1234/"
          CYPRESS_RECORD_KEY: "my-secret-key"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_COLOR: 1
          CI: true
        #continue-on-error: true
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host "🚀 [Phase 1] 쾌적망(Fast) 환경 성능 측정을 시작합니다. (01, 02 파일 대상)"

          Write-Host "📦 패키지 설치 시작 (node-ssh 포함)..."
          # 🌟 기존 install 대신 ci를 사용하여 package.json에 명시된 버전을 정확히 설치합니다.
          npm ci
          
          Write-Host "🚀 Cypress 바이너리 확인 및 설치..."
          npx cypress install 
          
          # 👇 [핵심] 01, 02 파일만 골라서 쾌적망 그룹으로 병렬 실행합니다.
          cmd /c "chcp 65001 & npx cy2 run --record --spec `"cypress/e2e/Performance`" --browser chrome --parallel --group `"Performance-Fast`" --ci-build-id ${{ github.ref_name }}-${{ github.run_id }}-Fast 2>&1" | Out-File -FilePath cypress.log -Encoding UTF8
          Get-Content cypress.log

    

      - name: 📊 Upload Fast Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # 👇 [수정됨] 복잡한 IP를 빼고 러너 번호(1, 2)로만 깔끔하게 저장합니다.
          name: Lighthouse-Fast-Report-${{ matrix.containers }} 
          path: cypress/reports/lighthouse
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  # ====================================================
  # [Phase 1-Notify] 쾌적망 테스트 결과 전송
  # ====================================================
  notify-fast:
    needs: [fast-run] 
    if: always()
    runs-on: [self-hosted, PC-Auto]
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"
    steps:
      - name: 📥 Download Fast Reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: Lighthouse-Fast-Report-*
          # 👇 [수정] 쾌적망 전용 폴더로 다운로드
          path: downloaded_fast_reports
        

      - name: Send Google Chat (Fast Mode)
        env:
          MSG_TITLE: "[성능][웹페이지로딩][Auto-PC] 로그캐치 웹페이지 로딩측정결과"
          MSG_NETWORK: "📡 네트워크 제한(Throttling) : 미적용 (사내망 속도 시뮬레이션으로 쾌적하게 측정)"
          MSG_TOBE: "10.10.54.41 (To-be) :"
          MSG_ASIS: "10.10.54.42 (As-is) :"
          MSG_DESC: "측정결과 : 자세한 세부사항은 해당 링크의 Artifacts의 다운로드 버튼 클릭하여 압축 파일을 확인해주세요"
          MSG_UNKNOWN: "확인 불가"
          MSG_UNIT: "점"
          MSG_AVG: "평균"
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $nowTime = Get-Date -Format 'yyyy-MM-dd HH:mm:ss'
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          function Get-AvgScore($ip) {
              $suffix = $ip.Split('.')[-1]
              
              # 👇 [핵심] 옛날 폴더 검사($folders) 로직을 지우고, 파일만 강력하게 싹 다 뒤집니다!
              $allFiles = @(Get-ChildItem -Path "downloaded_fast_reports" -Filter "*_$suffix-*.html" -Recurse -ErrorAction SilentlyContinue)
              
              if ($allFiles.Count -eq 0) { return $env:MSG_UNKNOWN }

              $latestFiles = @{}
              foreach ($file in $allFiles) {
                  $menuName = $file.Name -replace "lighthouse-report-(.*)_$suffix-.*", '$1'
                  $timeStr = ""
                  if ($file.Name -match "_$suffix-(.*)\.html") { $timeStr = $matches[1] }
                  if (-not $latestFiles[$menuName]) {
                      $latestFiles[$menuName] = $file
                  } else {
                      $existingTimeStr = ""
                      if ($latestFiles[$menuName].Name -match "_$suffix-(.*)\.html") { $existingTimeStr = $matches[1] }
                      if ($timeStr.CompareTo($existingTimeStr) -gt 0) { $latestFiles[$menuName] = $file }
                  }
              }

              $scores = @()
              foreach ($file in $latestFiles.Values) {
                  $content = Get-Content $file.FullName -Raw -Encoding UTF8
                  if ($content -match '(?s)"categories"\s*:\s*\{.*?"performance"\s*:\s*\{.*?"score"\s*:\s*([0-9.]+)') {
                      $score = [math]::Round([double]$matches[1] * 100)
                      $scores += $score
                      Write-Host "✅ [$ip] $($file.Name) -> $score$($env:MSG_UNIT)"
                  }
              }

              if ($scores.Count -gt 0) {
                  $avg = [math]::Round(($scores | Measure-Object -Average).Average, 2)
                  Write-Host "🏆 [$ip] Fast 최종 평균: $avg$($env:MSG_UNIT)"
                  return "$avg$($env:MSG_UNIT)"
              }
              return $env:MSG_UNKNOWN
          }


          $score41 = Get-AvgScore "10.10.54.41"
          $score42 = Get-AvgScore "10.10.54.42"
          
          $msgText = "$($env:MSG_TITLE) ($nowTime)`n"
          $msgText += "$($env:MSG_NETWORK)`n"
          $msgText += "$($env:MSG_TOBE) $($env:MSG_AVG) $score41 | $runUrl`n"
          $msgText += "$($env:MSG_ASIS) $($env:MSG_AVG) $score42 | $runUrl`n"
          $msgText += "$($env:MSG_DESC)"

          $body = @{ text = $msgText } | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri '${{ secrets.GOOGLE_CHAT_WEBHOOK }}' -Method Post -ContentType "application/json; charset=utf-8" -Body ([System.Text.Encoding]::UTF8.GetBytes($body))

  # ====================================================
  # [Phase 2] 제한망 (Limit) 성능 테스트 (03, 04 파일 수행)
  # ====================================================
  limit-run:
    needs: [notify-fast] # 쾌적망 알림까지 다 끝난 후 배턴을 넘겨받아 실행합니다.
    if: always()
    runs-on: [self-hosted, PC-Auto]
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2]
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          npm install --no-audit  
          npx cypress install

      - name: Clean Previous Reports
        run: | 
          Remove-Item -Path "cypress/reports" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "cypress/screenshots" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Cypress Run (Limit Mode)
        env:
          CYPRESS_API_URL: "http://10.10.54.5:1234/"
          CYPRESS_RECORD_KEY: "my-secret-key"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_COLOR: 1
          CI: true
        #continue-on-error: true
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          Write-Host "🚀 [Phase 2] 제한망(Limit) 환경 성능 측정을 시작합니다. (03, 04 파일 대상)"
          
          # 👇 [핵심] 03, 04 파일만 골라서 제한망 그룹으로 병렬 실행합니다.
          cmd /c "chcp 65001 & npx cy2 run --record --spec `"cypress/e2e/Performance_Network_Limit`" --browser chrome --parallel --group `"Performance-Limit`" --ci-build-id ${{ github.ref_name }}-${{ github.run_id }}-Limit 2>&1" | Out-File -FilePath cypress.log -Encoding UTF8
          Get-Content cypress.log


      - name: 📊 Upload Limit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # 👇 [수정] 껍데기(폴더명)에 IP를 뺍니다. 러너 번호(-1, -2)만으로 덮어쓰기 완벽 방지!
          name: Lighthouse-Limit-Report-${{ matrix.containers }} 
          path: cypress/reports/lighthouse
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  # ====================================================
  # [Phase 2-Notify] 제한망 테스트 결과 전송
  # ====================================================
  notify-limit:
    needs: [limit-run] 
    if: always()
    runs-on: [self-hosted, PC-Auto]
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"
    steps:
      - name: 📥 Download Limit Reports
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: Lighthouse-Limit-Report-*
          # 👇 [수정] 제한망 전용 폴더로 다운로드
          path: downloaded_limit_reports

      - name: Send Google Chat (Limit Mode)
        env:
          MSG_TITLE: "[성능][웹페이지로딩][Auto-PC] 로그캐치 웹페이지 로딩측정결과"
          MSG_NETWORK: "📡 네트워크 제한(Throttling) : 적용됨 (제한된 네트워크 환경으로 빡빡하게 측정)"
          MSG_TOBE: "10.10.54.41 (To-be) :"
          MSG_ASIS: "10.10.54.42 (As-is) :"
          MSG_DESC: "측정결과 : 자세한 세부사항은 해당 링크의 Artifacts의 다운로드 버튼 클릭하여 압축 파일을 확인해주세요"
          MSG_UNKNOWN: "확인 불가"
          MSG_UNIT: "점"
          MSG_AVG: "평균"
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $nowTime = Get-Date -Format 'yyyy-MM-dd HH:mm:ss'
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          function Get-AvgScore($ip) {
              $suffix = $ip.Split('.')[-1]
              
              # 👇 [핵심] 제한망 전용 폴더의 파일을 강력하게 싹 다 뒤집니다!
              $allFiles = @(Get-ChildItem -Path "downloaded_limit_reports" -Filter "*_$suffix-*.html" -Recurse -ErrorAction SilentlyContinue)
              
              if ($allFiles.Count -eq 0) { return $env:MSG_UNKNOWN }

              $latestFiles = @{}
              foreach ($file in $allFiles) {
                  $menuName = $file.Name -replace "lighthouse-report-(.*)_$suffix-.*", '$1'
                  $timeStr = ""
                  if ($file.Name -match "_$suffix-(.*)\.html") { $timeStr = $matches[1] }
                  if (-not $latestFiles[$menuName]) {
                      $latestFiles[$menuName] = $file
                  } else {
                      $existingTimeStr = ""
                      if ($latestFiles[$menuName].Name -match "_$suffix-(.*)\.html") { $existingTimeStr = $matches[1] }
                      if ($timeStr.CompareTo($existingTimeStr) -gt 0) { $latestFiles[$menuName] = $file }
                  }
              }

              $scores = @()
              foreach ($file in $latestFiles.Values) {
                  $content = Get-Content $file.FullName -Raw -Encoding UTF8
                  if ($content -match '(?s)"categories"\s*:\s*\{.*?"performance"\s*:\s*\{.*?"score"\s*:\s*([0-9.]+)') {
                      $score = [math]::Round([double]$matches[1] * 100)
                      $scores += $score
                      Write-Host "✅ [$ip] $($file.Name) -> $score$($env:MSG_UNIT)"
                  }
              }

              if ($scores.Count -gt 0) {
                  $avg = [math]::Round(($scores | Measure-Object -Average).Average, 2)
                  Write-Host "🏆 [$ip] Limit 최종 평균: $avg$($env:MSG_UNIT)"
                  return "$avg$($env:MSG_UNIT)"
              }
              return $env:MSG_UNKNOWN
          }

          $score41 = Get-AvgScore "10.10.54.41"
          $score42 = Get-AvgScore "10.10.54.42"
          
          $msgText = "$($env:MSG_TITLE) ($nowTime)`n"
          $msgText += "$($env:MSG_NETWORK)`n"
          $msgText += "$($env:MSG_TOBE) $($env:MSG_AVG) $score41 | $runUrl`n"
          $msgText += "$($env:MSG_ASIS) $($env:MSG_AVG) $score42 | $runUrl`n"
          $msgText += "$($env:MSG_DESC)"

          $body = @{ text = $msgText } | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri '${{ secrets.GOOGLE_CHAT_WEBHOOK }}' -Method Post -ContentType "application/json; charset=utf-8" -Body ([System.Text.Encoding]::UTF8.GetBytes($body))
