name: Auto-PC Work (Dev_RELEASE_UI)

env:
  PRODUCT_NAME: "로그캐치"
  TEST_TYPE: Dev_RELEASE
  TZ: Asia/Seoul
   # 👇 여기에 추가하세요! (GitHub Actions가 내부적으로 Node.js 24를 사용하도록 강제함)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "master" ]
  schedule:
    - cron: '5 2 * * 1-5'
  workflow_dispatch:

jobs:
  # ====================================================
  # [Job 1] QA 리눅스 서버(Hyper-V)에 최신 버전 배포 (딱 1번만 실행)
  # ====================================================
  deploy-qa:
    runs-on: [self-hosted, PC-Auto]
    outputs:
      # 👇 다음 Job들이 읽을 수 있도록 변수를 밖으로 빼줍니다.
      skip_all: ${{ steps.check_version.outputs.skip_all }}
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🔍 Find Latest Build from Redmine
        id: check_version # ID 추가
        env:
          SSH_KEY_DATA: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          # 💡 [필수 추가 1] 이 스텝에서도 SSH를 쓰려면 변수를 다시 정의해야 합니다.
          $keyPath = "$env:TEMP\id_auto"
          $env:SSH_KEY_DATA.Trim() | Out-File -FilePath $keyPath -Encoding ASCII
          $target = "${{ secrets.QA_SERVER_USER }}@${{ secrets.QA_SERVER_IP }}"
          $remotePath = "/home/${{ secrets.QA_SERVER_USER }}/deploy"

          $loginUrl = "https://project.warevalley.com/login"
          #RELEASE 빌드파일 경로
          $repoBaseUrl = "https://project.warevalley.com/projects/chakra-error/repository/to_tech/show/logcatch/RELEASE/logcatch"
          
          $userId = "${{ secrets.REDMINE_USER_ID }}"
          $userPw = "${{ secrets.REDMINE_PW }}"

          if (Test-Path cookies.txt) { Remove-Item cookies.txt }

          Write-Host "1️⃣ Redmine logining..."
          $loginHtml = (curl.exe -k -s -c cookies.txt $loginUrl) -join "`n"
          $token = if ($loginHtml -match 'name="authenticity_token" value="([^"]+)"') { $matches[1] } else { "" }

          curl.exe -k -s -b cookies.txt -c cookies.txt `
                   --data-urlencode "username=$userId" `
                   --data-urlencode "password=$userPw" `
                   --data-urlencode "authenticity_token=$token" `
                   $loginUrl > $null

          Write-Host "2️⃣ New Version Searching..."
          $repoHtml = (curl.exe -k -s -b cookies.txt $repoBaseUrl) -join "`n"
          $folderPattern = '([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+_r[0-9]+)'
          $allMatches = [regex]::Matches($repoHtml, $folderPattern)
          if ($allMatches.Count -eq 0) { Write-Error "❌ Cannot find version."; exit 1 }
          
          $versions = $allMatches | ForEach-Object { $_.Groups[1].Value } | Select-Object -Unique
          $latestVersion = $versions | Sort-Object { [version]($_ -replace '_r.*', '') }, { [int]($_ -replace '.*_r', '') } | Select-Object -Last 1

          # 💡 [필수 수정 2] SSH 명령어에 큰따옴표(")를 꼭 넣어야 합니다.
          Write-Host "3️⃣ Server Version install checking..."
          $installedVersion = ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i $keyPath $target "cat $remotePath/last_installed_version.txt 2>/dev/null || echo none"
          
          if ($null -eq $installedVersion) { $installedVersion = "none" }
          $installedVersion = $installedVersion.ToString().Trim()

          # 👇 여기서부터 수정 (기존 if문을 이 블록으로 교체)
          if ($installedVersion -eq $latestVersion) {
            Write-Host "[SKIP] The currently installed version ($installedVersion) is the latest. Stopping all operations."
            
            # 💡 중요: 다음 Job들이 읽을 수 있도록 skip_all을 true로 설정
            echo "skip_all=true" >> $env:GITHUB_OUTPUT
            
            # 현재 스텝 내에서 쓸 환경변수도 세팅
            echo "SKIP_INSTALL=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            exit 0
          } else {
            Write-Host "🚀 [NEW] New version found : $latestVersion"
            
            # 💡 중요: 진행해야 하므로 skip_all을 false로 설정
            echo "skip_all=false" >> $env:GITHUB_OUTPUT
            
            echo "SKIP_INSTALL=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            echo "LATEST_VERSION=$latestVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            
            # 파일명 추출 로직 
            $folderUrl = "$repoBaseUrl/$latestVersion"
            $folderHtml = (curl.exe -k -s -b cookies.txt $folderUrl) -join "`n"
            $mainFileName = [regex]::Match($folderHtml, '(logcatch_linux_x86-64_[^\"]+\.bin)').Groups[1].Value
            $partyFileName = [regex]::Match($folderHtml, '(logcatch_3rdparty_linux_x86-64_[^\"]+\.bin)').Groups[1].Value

            echo "MAIN_FILE_NAME=$mainFileName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            echo "PARTY_FILE_NAME=$partyFileName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: 🚀 Native SSH Deploy (Redmine Direct Download)
        env:
          SSH_KEY_DATA: ${{ secrets.SSH_PRIVATE_KEY }}
        if: env.SKIP_INSTALL != 'true'
        run: |
          # SSH 접속 준비
          $keyPath = "$env:TEMP\id_auto"
          $env:SSH_KEY_DATA.Trim() | Out-File -FilePath $keyPath -Encoding ASCII
          $target = "${{ secrets.QA_SERVER_USER }}@${{ secrets.QA_SERVER_IP }}"
          $remotePath = "/home/${{ secrets.QA_SERVER_USER }}/deploy"
          $mainName = "${env:MAIN_FILE_NAME}"
          $partyName = "${env:PARTY_FILE_NAME}"

          Write-Host " [Step 1] Initialize existing installation environment and clean previous installation files (.bin)...."
          $cleanup = "sudo rm -f /etc/profile.d/logcatch.sh; sudo pkill -9 -u logcatch || true; sudo pkill -9 postgres || true; if [ -f $remotePath/logcatch.install.info ]; then printf 'uninstall\n' | sudo $remotePath/$mainName -X $remotePath/logcatch.install.info || true; fi; sudo userdel -rf logcatch || true; sudo rm -rf /home/logcatch /var/lib/pgsql; rm -f $remotePath/*.bin"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i $keyPath $target "export TERM=linux; $cleanup"

          Write-Host " [Step 2] Delivery of access permissions (Cookies) to the QA server and file download (enhanced stability)..."
          scp -o BatchMode=yes -o StrictHostKeyChecking=no -i $keyPath cookies.txt "${target}:${remotePath}/cookies.txt"

          # (수정 후)  ALPHA를 RELEASE로 변경!
          $rawBaseUrl = "https://project.warevalley.com/projects/chakra-error/repository/to_tech/raw/logcatch/RELEASE/logcatch/${env:LATEST_VERSION}"
          
          #  [네트워크 끊김 완벽 방어] 
          # -f : 다운로드 실패 시 가짜 파일(HTML) 생성 방지
          # --retry 3 : 끊기거나 실패하면 최대 3번까지 자동으로 다시 시도
          # --retry-delay 2 : 재시도 전 2초 대기
          $downloadCmd = "curl -k -f --retry 3 --retry-delay 2 -b $remotePath/cookies.txt -o $remotePath/$mainName $rawBaseUrl/$mainName && curl -k -f --retry 3 --retry-delay 2 -b $remotePath/cookies.txt -o $remotePath/$partyName $rawBaseUrl/$partyName"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i $keyPath $target "$downloadCmd"

          Write-Host "🚀 [Step 3] Run installation script (Background Job with 180s Timeout)...."
          
          # [Step 3] 수정 부분
          $install = "sudo chmod 755 $remotePath/$mainName $remotePath/$partyName; sudo LANG=C LC_ALL=C $remotePath/$mainName -b -f"
          
          # 프로필 수정 후 권한 보강
          $fixProfile = "if [ -f /etc/profile.d/logcatch.sh ]; then sudo tr -d '\r' < /etc/profile.d/logcatch.sh | sudo tee /etc/profile.d/logcatch.sh.tmp > /dev/null; sudo mv /etc/profile.d/logcatch.sh.tmp /etc/profile.d/logcatch.sh; sudo chmod 755 /etc/profile.d/logcatch.sh; fi"
          
          # 서비스 제어: 비동기(&) 보다는 직접 restart 명령어를 순차적으로 실행 (직관적 에러 확인을 위해)
          $svcControl = "sudo systemctl daemon-reload; sudo systemctl restart logcatch_redis; sleep 3; sudo systemctl restart logcatch_server; sleep 3; sudo systemctl restart logcatch_taskmgr"

          $fullCmd = "export TERM=linux; $install && $fixProfile && $svcControl"

          $job = Start-Job -ScriptBlock {
              param($keyPath, $target, $cmd)
              $ErrorActionPreference = "Continue" 
              ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i $keyPath $target "$cmd 2>&1"
          } -ArgumentList $keyPath, $target, $fullCmd

          # 💡 타임아웃을 300초(5분)로 늘려 서비스 안착 시간을 확보합니다.
          if (-not (Wait-Job $job -Timeout 300)) {
              Write-Host "⚠️ [TIMEOUT] 300s elapsed. 포트 체크로 넘어갑니다."
              Stop-Job $job
          } else {
              Write-Host " Installation job finished naturally."
          }
          
          # 4. 💡 로그 출력 (에러 방지 처리가 추가된 버전)
          Write-Host "================= [ Install Log Summary ] ================="
          try {
              # -ErrorAction SilentlyContinue 를 추가하여 로그 내부의 경고가 에러를 유발하지 않게 함
              $logData = Receive-Job $job -ErrorAction SilentlyContinue
              if ($logData) {
                  # 텍스트로 변환하여 출력 (에러 객체가 아닌 단순 문자열로 취급)
                  $logData | Out-String | Write-Host
              }
          } catch {
              Write-Host " There were some warnings while retrieving the logs, but we ignored them and proceeded."
          }
          Write-Host "=============================================================="
          
          Remove-Job $job

          # 5. 💡 강제 성공 처리 및 즉시 다음 단계 진행
          $env:LASTEXITCODE = 0
          Write-Host " Installation step finished. Moving to Port Polling..."

          
          Write-Host " [Step 4] Port (18443) waiting to start..."
          $success = $false
          for ($i = 1; $i -le 30; $i++) {
              Write-Host " Attempt $i/30: Polling Port 18443..."
              $check = ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i $keyPath $target "sudo netstat -tpln | grep -i listen | grep -c :18443"
              if ($check.Trim() -match '^[1-9][0-9]*$') {
                  Write-Host " Port open detected! Installation complete. Proceeding to Cypress test."
                  $success = $true
                  break
              }
              Start-Sleep -Seconds 15
          }
          
          # 💡 포트가 끝내 안 열리면 워크플로우를 실패 처리하여 원인을 바로 알 수 있게 합니다.
          
          if ($success) {
              Write-Host " Port open detected! Installation complete."
              Write-Host " [Step 5] Record successful installation version on server: $env:LATEST_VERSION"
              # 리눅스 서버에 텍스트 파일로 버전 저장
             ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i $keyPath $target "echo $env:LATEST_VERSION > $remotePath/last_installed_version.txt"
          } else {
              Write-Error "❌ 18443 The port is not open. Please check the installation log."
              exit 1
          }


  # ====================================================
  # [Job 2] 테스트 실행 (Runner 5개 병렬 구동)
  # ====================================================
  cypress-run:
    needs: deploy-qa # 👇 [핵심] deploy-qa 작업이 완전히 끝난 후에만 실행되도록 설정
    # 👇 새 버전이 아닐 경우 이 Job 실행 안 함
    if: needs.deploy-qa.outputs.skip_all != 'true'
    runs-on: [self-hosted, PC-Auto]
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2, 3, 4, 5]

    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean Previous Reports
        run: |
          Remove-Item -Path "cypress/reports" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "cypress/screenshots" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "cypress/videos" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Get Current Time
        run: echo "NOW=$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create Dummy Report File
        run: |
          $dir = "cypress/reports/json_logs"
          if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Force -Path $dir }
          $suiteUUID = [guid]::NewGuid().ToString()
          $testUUID  = [guid]::NewGuid().ToString()
          
          $dummyContent = @"
          {
            "stats": { "suites": 1, "tests": 1, "passes": 1, "pending": 0, "failures": 0, "start": "2024-01-01T00:00:00.000Z", "end": "2024-01-01T00:00:01.000Z", "duration": 100, "testsRegistered": 1, "passPercent": 100, "pendingPercent": 0, "other": 0, "hasOther": false, "skipped": 0, "hasSkipped": false },
            "results": [ { "uuid": "$suiteUUID", "title": "System Check", "fullFile": "", "file": "", "beforeHooks": [], "afterHooks": [], "tests": [ { "title": "Report Placeholder", "fullTitle": "System Check Report Placeholder", "timedOut": false, "duration": 100, "state": "passed", "speed": "fast", "pass": true, "fail": false, "pending": false, "context": null, "code": "true", "err": {}, "uuid": "$testUUID", "parentUUID": "$suiteUUID", "isHook": false, "skipped": false } ], "suites": [], "passes": ["$testUUID"], "failures": [], "pending": [], "skipped": [], "duration": 100, "root": false, "rootEmpty": false, "_timeout": 2000 } ],
            "meta": { "mocha": { "version": "7.0.0" }, "mochawesome": { "options": { "quiet": false, "reportFilename": "mochawesome", "saveHtml": false, "saveJson": true, "consoleReporter": "spec", "useInlineDiffs": false, "code": true }, "version": "7.1.3" }, "marge": { "options": { "reportDir": "cypress/reports/json_logs", "overwrite": false, "html": false, "json": true }, "version": "6.2.0" } }
          }
          "@
          $dummyContent | Out-File -FilePath "$dir/dummy.json" -Encoding UTF8

      - name: Cypress Run
        id: cypress
        env:
          CYPRESS_BASE_URL: "https://10.10.54.51:18443/logcatch"
          CYPRESS_API_URL: "http://10.10.54.5:1234/"
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 👇 [추가] 보안 인증서 경고를 무시하고 접속을 허용합니다.
          NODE_TLS_REJECT_UNAUTHORIZED: 0
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          # 2. 11번 파일을 찾아서 아예 삭제 ("*11_Dev_Basic*" 시작하는 파일들 이 러너 환경에서만 삭제됨 )
          Get-ChildItem -Path "cypress/e2e/Basic_functions_Dev_check" -Recurse | Where-Object { $_.Name -like "*11_Dev_Basic*" } | Remove-Item -Force
          Write-Host "✅ 11_Basic 운영 태스크 파일을 물리적으로 제거하여 실행에서 제외했습니다."
          
          npm install
          npm install cy2 mochawesome mochawesome-merge mochawesome-report-generator --save-dev
          npx cypress install

          # 스펙 경로를 Dev_Check 폴더로 변경하고 따옴표 처리를 안전하게 수정했습니다.
          # $specPath = "cypress/e2e/UI_Module_Dev_Check/**/*.cy.js"
          # 수정된 부분: 중괄호를 사용하여 두 폴더의 모든 .cy.js 파일을 실행 대상으로 잡습니다.
          $specPath = "cypress/e2e/{UI_Module_Dev_Check,Basic_functions_Dev_check}/**/*.cy.js"

          cmd /c "chcp 65001 & npx cy2 run --record --spec $specPath --browser chrome --parallel --ci-build-id ${{ github.ref_name }}-${{ github.run_id }}-UI 2>&1" | Out-File -FilePath cypress.log -Encoding UTF8
          Get-Content cypress.log

      - name: Extract Dashboard URL
        if: always()
        run: |
          $logPath = "cypress.log"
          if (Test-Path $logPath) {
            $content = Get-Content $logPath -Raw -Encoding UTF8
            if ($content -match "(/run/[a-zA-Z0-9-]+)") {
                $runPath = $matches[1]
                $realUrl = "http://10.10.54.5:8080$runPath"
                Write-Host "✅ 대시보드 URL 생성 완료: $realUrl"
                echo $realUrl | Out-File -FilePath run_url.txt -Encoding UTF8
            } else {
                Write-Host "⚠️ 로그에서 Run ID를 찾을 수 없습니다."
                echo "http://10.10.54.5:8080/projects" | Out-File -FilePath run_url.txt -Encoding UTF8
            }
          } else { Write-Host "❌ cypress.log 파일이 없습니다." }

      - name: Upload URL File
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-url-${{ matrix.containers }}
          path: run_url.txt
          retention-days: 1
          if-no-files-found: ignore

      - name: 📂 리포트 데이터 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dev-Raw-Data-${{ matrix.containers }}
          path: |
            cypress/reports/json_logs
            cypress/screenshots
          retention-days: 1
          if-no-files-found: ignore

  # ====================================================
  # [Job 2-1] 태스크 재시작 테스트 (단독 실행)
  # ====================================================
  restart-task-run:
    needs: cypress-run  # Job 2이 끝나야 시작
    # 👇 새 버전이 아닐 경우 이 Job 실행 안 함
    if: needs.deploy-qa.outputs.skip_all != 'true'        
    runs-on: [self-hosted, PC-Auto]
    # 👇 [추가] cy2 실행을 위한 환경 변수 복사
    env:
      CYPRESS_BASE_URL: "https://10.10.54.51:18443/logcatch" # 💡 필수 추가
      CYPRESS_API_URL: "http://10.10.54.5:1234/"
      CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COMMIT_INFO_MESSAGE: ${{ github.event.head_commit.message }}
      NODE_TLS_REJECT_UNAUTHORIZED: 0                       # 💡 보안 경고 무시
      NO_COLOR: 1
      CI: true
      continue-on-error: true # 에러가 나도 업로드는 해야 함
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress Run (Restart Task Spec)
        run: |
          # 1. 초기 설정 및 설치
          $ErrorActionPreference = "Continue" 
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          npm install --no-audit  
          npx cypress install

          # 2. 💡 파일 존재 여부 체크 및 예외 처리
          $targetFile = Get-ChildItem -Path "cypress/e2e/Basic_functions_Dev_check" -Recurse | 
                        Where-Object { $_.Name -like "*11_Dev_Basic*" } | 
                        Select-Object -First 1

          if (-not $targetFile) {
              # 💡 에러(Write-Error) 대신 정보성 메시지 출력 후 종료
              Write-Host "⚠️ [SKIP] 실행할 테스트 파일(*11_Dev_Basic*)이 존재하지 않습니다. 작업을 건너뜁니다."
              exit 0  # 🚀 성공 코드를 반환하여 파이프라인 중단을 막음
          }

          $targetSpec = $targetFile.FullName
          Write-Host "🚀 [Job 2] 단독 실행 파일: $targetSpec"

          # 실행 시 변수를 따옴표로 감싸서 공백/한글 이슈 방지
          cmd /c "chcp 65001 & npx cy2 run --record --spec `"$targetSpec`" --browser chrome --group 'Restart-Job' --ci-build-id ${{ github.ref_name }}-${{ github.run_id }}-Basic 2>&1" | Out-File -FilePath cypress_restart.log -Encoding UTF8
         
          Get-Content cypress_restart.log
          
      - name: 📂 리포트 데이터 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # 💡 패턴 매칭을 위해 이름을 맞춥니다.
          name: Dev-Raw-Data-Restart 
          path: |
            cypress/reports/json_logs/*.json
            cypress/screenshots/**
          retention-days: 1
          if-no-files-found: ignore

  # ====================================================
  # [Job 3] 종합 알림 (데이터 통합 & 리포트 생성)
  # ====================================================
  notify-result:
    needs: [deploy-qa, cypress-run, restart-task-run] # 💡 두 Job이 모두 끝나야 실행
    if: always() && needs.deploy-qa.outputs.skip_all != 'true'
    runs-on: [self-hosted, PC-Auto]
    
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      - name: 🧹 기존 데이터 청소 (Clean Workspace)
        run: |
          Write-Host "이전 작업의 잔여 데이터를 삭제합니다..."
          Remove-Item -Path "all_raw_data" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "final_report_UI" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "downloaded_url" -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Clear Finish!"

      - name: Get Current Time
        run: echo "NOW=$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download Dashboard URL
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: dashboard-url-*
          merge-multiple: true
          path: downloaded_url

      - name: Download All Raw Data
        uses: actions/download-artifact@v4
        with:
          pattern: "*-Raw-Data*" # 💡 Dev-Raw-* 와 Restart-Raw-Data를 모두 통합 다운로드
          path: all_raw_data
          merge-multiple: true
          
      - name: 🔍 파일 구조 확인
        run: Get-ChildItem -Path all_raw_data -Recurse       

      - name: 🔄 리포트 하나로 통합하기
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          # 💡 [핵심 보완] JSON 파일이 있는지 먼저 확인 (설치 실패 시 대응)
          $reportDir = "all_raw_data"
          if (-not (Test-Path $reportDir) -or (Get-ChildItem -Path "$reportDir\**\*.json" -ErrorAction SilentlyContinue).Count -eq 0) {
              Write-Host "⚠️ [INFO] No JSON report file to integrate. (Test not executed due to installation step error)"
              # 빈 배열을 가진 더미 JSON 생성하여 이후 단계 에러 방지
              "[]" | Out-File -FilePath "merged_report.json" -Encoding UTF8
              exit 0
          }

          npm install mochawesome-merge mochawesome-report-generator --no-save
          cmd /c "npx mochawesome-merge all_raw_data/**/*.json > merged_report.json"
          
          if (Test-Path "merged_report.json") {
              npx marge merged_report.json --reportDir ./final_report_Dev --inline --charts --reportTitle "Dev Report" --reportFilename "LogCatch_Dev_Report"
          }

      - name: Send Google Chat (UI)
        if: always() 
        env:
          # 💡 설치 작업과 테스트 작업의 결과를 모두 가져옵니다.
          DEPLOY_STATUS: ${{ needs.deploy-qa.result }}
          CYPRESS_STATUS: ${{ needs.cypress-run.result }}
          MSG_SUCCESS: "*[성공]*[Auto-PC]"
          MSG_FAIL: "*[실패]*[Auto-PC]"
          MSG_TITLE: "확인결과"
          LABEL_DASH: "대시보드"
          LABEL_GIT: "GitHub(Report)"
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          # 💡 [핵심 추가] 스크린샷 경로 변수 정의
          # 이전 단계에서 download-artifact를 통해 'all_raw_data'에 모두 모았습니다.
          $screenshotPath = "all_raw_data/screenshots"
          
          # 1️⃣ 기본 상태값 추출 (대소문자 구분 없이 비교하기 위해 소문자로 변환)
          $deployStatus = "${{ env.DEPLOY_STATUS }}".ToLower()
          $cypressStatus = "${{ env.CYPRESS_STATUS }}".ToLower()

          # 디버깅용 출력 (실행 로그에서 실제로 어떤 값이 들어오는지 볼 수 있습니다)
          Write-Host "DEBUG - Deploy Status: [$deployStatus]"
          Write-Host "DEBUG - Cypress Status: [$cypressStatus]"

          $isActuallyFailed = $false
          $statusDetail = ""

          # 2️⃣ [설치 단계 체크] 
          if ($deployStatus -eq "failure") {
              $isActuallyFailed = $true
              $statusDetail = "[Installation Failed] Error occurred during installation (Log check required)"
          }
          elseif ($deployStatus -eq "cancelled") {
              $isActuallyFailed = $true
              $statusDetail = " [Cancel Action] Deployment was cancelled"
          }
          # 💡 [핵심 추가] 설치가 성공하지 않았는데 failure도 아니라면(예: skipped) 테스트가 안 돈 것이므로 실패로 간주
          elseif ($deployStatus -ne "success") {
              $isActuallyFailed = $true
              $statusDetail = " [Not Executed] Installation step did not complete successfully"
          }
          
          # 3️⃣ [테스트 단계 체크] 설치는 성공했을 때만 테스트 결과를 상세히 봅니다.
          else {
              # 스크린샷 파일 확인
              if (Test-Path $screenshotPath) {
                  $failedScreenshots = Get-ChildItem -Path $screenshotPath -Recurse -Filter "*(failed)*.png"
                  if ($failedScreenshots.Count -gt 0) {
                      $isActuallyFailed = $true
                      $failNames = $failedScreenshots | ForEach-Object { Split-Path $_.Directory -Leaf } | Select-Object -Unique
                      $statusDetail = "[Test Failed] $($failedScreenshots.Count) Scenario failure ( $($failNames -join ', ') )"
                  }
              }
              
              # 스크린샷은 없는데 테스트 작업 자체가 실패/취소된 경우
              if (-not $isActuallyFailed -and ($cypressStatus -eq "failure" -or $cypressStatus -eq "cancelled")) {
                  $isActuallyFailed = $true
                  $statusDetail = " [Test Stopped] System error or cancellation while running Cypress"
              }
          }

          # 최종 타이틀 결정 (매우 중요!)
          $title = if ($isActuallyFailed) { $env:MSG_FAIL } else { $env:MSG_SUCCESS }

          # 메시지 조립
          $pName = $env:PRODUCT_NAME
          $tType = $env:TEST_TYPE
          $mTitle = $env:MSG_TITLE
          $time = $env:NOW
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $url = if (Test-Path "downloaded_url/run_url.txt") { (Get-Content "downloaded_url/run_url.txt" -Raw).Trim() } else { "http://10.10.54.5:8080/projects" }

          $msgBody = @"
          $title $pName $tType $mTitle ($time)
          $statusDetail

          ${env:LABEL_DASH} : $url
          ${env:LABEL_GIT} : $runUrl
          "@

          $payload = @{ text = $msgBody } | ConvertTo-Json -Compress
          $utf8Payload = [System.Text.Encoding]::UTF8.GetBytes($payload)
          Invoke-RestMethod -Uri '${{ secrets.GOOGLE_CHAT_WEBHOOK }}' -Method Post -ContentType "application/json; charset=utf-8" -Body $utf8Payload