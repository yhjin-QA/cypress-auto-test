name: Auto-PC Work (Dev_UI&Basic)

env:
  PRODUCT_NAME: "로그캐치"
  TEST_TYPE: Dev
  TZ: Asia/Seoul

on:
  push:
    branches: [ "master" ]
  schedule:
    - cron: '5 2 * * 1-5'
  
  workflow_dispatch:

jobs:
  # ====================================================
  # [Job 1] QA 리눅스 서버(Hyper-V)에 최신 버전 배포 (딱 1번만 실행)
  # ====================================================
  deploy-qa:
    runs-on: [self-hosted, PC-Auto]
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Latest Build & 3rdparty Files
        run: |
          $deployFolder = "C:\Auto_Deploy"
          # 1. 메인 엔진 파일 찾기
          $mainFile = Get-ChildItem -Path $deployFolder -Filter "logcatch_linux_*.bin" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          # 2. 동일한 버전의 3rdparty 파일 찾기
          $partyFile = Get-ChildItem -Path $deployFolder -Filter "logcatch_3rdparty_*.bin" | Sort-Object LastWriteTime -Descending | Select-Object -First 1

          if (!$mainFile -or !$partyFile) { Write-Error "❌ 필요한 파일이 부족합니다."; exit 1 }

          echo "MAIN_FILE_PATH=$($mainFile.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "MAIN_FILE_NAME=$($mainFile.Name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "PARTY_FILE_PATH=$($partyFile.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Native SSH & SCP Deploy (Session Disconnect Fix)
        env:
          SSH_KEY_DATA: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # 1. SSH Key Setup (Same as before)
          $keyPath = "$env:TEMP\id_auto"
          $env:SSH_KEY_DATA.Trim() | Out-File -FilePath $keyPath -Encoding ASCII
          
          $target = "${{ secrets.QA_SERVER_USER }}@${{ secrets.QA_SERVER_IP }}"
          $remotePath = "/home/${{ secrets.QA_SERVER_USER }}/deploy"
          $mainName = "${env:MAIN_FILE_NAME}"
          $partyName = "${env:PARTY_FILE_NAME}"

          Write-Host "🚀 [Step 1] Cleanup & Automated Uninstall..."
          # 1. 기존 DB 데이터 및 설정 파일 완전 강제 삭제 추가
          # 2. 기존 프로세스 및 유저 정리
          $cleanup = "sudo rm -f /etc/profile.d/logcatch.sh; sudo pkill -9 -u logcatch || true; sudo pkill -9 postgres || true; if [ -f $remotePath/logcatch.install.info ]; then printf 'uninstall\n' | sudo $remotePath/$mainName -X $remotePath/logcatch.install.info || true; fi; sudo userdel -rf logcatch || true; sudo rm -rf /home/logcatch /var/lib/pgsql"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i $keyPath $target "export TERM=linux; $cleanup"

          Write-Host "📂 [Step 2] Transferring Binaries..."
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i $keyPath $target "mkdir -p $remotePath"
          scp -o BatchMode=yes -o StrictHostKeyChecking=no -i $keyPath "${env:MAIN_FILE_PATH}" "${target}:${remotePath}/"
          scp -o BatchMode=yes -o StrictHostKeyChecking=no -i $keyPath "${env:PARTY_FILE_PATH}" "${target}:${remotePath}/"

          Write-Host "🚀 [Step 3] Executing Installation (Force-Disconnect after 90s)..."
          $install = "sudo chmod 755 $remotePath/$mainName $remotePath/$partyName; sudo $remotePath/$mainName -b -f"
          $fixProfile = "if [ -f /etc/profile.d/logcatch.sh ]; then sudo tr -d '\r' < /etc/profile.d/logcatch.sh | sudo tee /etc/profile.d/logcatch.sh.tmp > /dev/null; sudo sed -i 's/expot/export/g' /etc/profile.d/logcatch.sh.tmp; sudo sed -i 's/fo poc in/for poc in/g' /etc/profile.d/logcatch.sh.tmp; sudo mv /etc/profile.d/logcatch.sh.tmp /etc/profile.d/logcatch.sh; sudo chmod 755 /etc/profile.d/logcatch.sh; fi"
          $svcControl = "sudo systemctl stop logcatch_taskmgr || true; sudo systemctl stop logcatch_server || true; sudo systemctl stop logcatch_redis || true; sleep 2; (sudo systemctl start logcatch_redis && sudo systemctl start logcatch_server && sudo systemctl start logcatch_taskmgr > /dev/null 2>&1 &)"

          # 💡 PowerShell 방식의 타임아웃 처리
          $job = Start-Job -ScriptBlock {
              param($keyPath, $target, $cmd)
              ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i $keyPath $target $cmd
          } -ArgumentList $keyPath, $target, "export TERM=linux; $install && $fixProfile && $svcControl"

          # 90초 대기 후 작업이 안 끝나면 강제 종료하고 다음 단계 진행
          if (-not (Wait-Job $job -Timeout 90)) {
              Write-Host "⚠️ Installation session timed out as expected (90s). Cleaning up session..."
              Stop-Job $job
          }
          Remove-Job $job
          
          Write-Host "🕵️ [Step 4] Finalizing Readiness Check (Port 18443)..."
          $success = $false
          for ($i = 1; $i -le 30; $i++) {
              Write-Host "⏳ Attempt $i/30: Polling Port 18443..."
              # 이 짧은 SSH 세션은 결과만 받고 즉시 닫힙니다.
              $check = ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i $keyPath $target "sudo netstat -tpln | grep -i listen | grep -c :18443"
              
              if ($check.Trim() -match '^[1-9][0-9]*$') {
                  Write-Host "✅ PORT_OPEN_DETECTED! Moving to Cypress Job."
                  $success = $true
                  break
              }
              Start-Sleep -Seconds 15
          }


  # ====================================================
  # [Job 2] 테스트 실행 (Runner 5개 병렬 구동)
  # ====================================================
  cypress-run:
    needs: deploy-qa # 👇 [핵심] deploy-qa 작업이 완전히 끝난 후에만 실행되도록 설정
    runs-on: [self-hosted, PC-Auto]
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2, 3, 4, 5]

    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean Previous Reports
        run: |
          Remove-Item -Path "cypress/reports" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "cypress/screenshots" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "cypress/videos" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Get Current Time
        run: echo "NOW=$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create Dummy Report File
        run: |
          $dir = "cypress/reports/json_logs"
          if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Force -Path $dir }
          $suiteUUID = [guid]::NewGuid().ToString()
          $testUUID  = [guid]::NewGuid().ToString()
          
          $dummyContent = @"
          {
            "stats": { "suites": 1, "tests": 1, "passes": 1, "pending": 0, "failures": 0, "start": "2024-01-01T00:00:00.000Z", "end": "2024-01-01T00:00:01.000Z", "duration": 100, "testsRegistered": 1, "passPercent": 100, "pendingPercent": 0, "other": 0, "hasOther": false, "skipped": 0, "hasSkipped": false },
            "results": [ { "uuid": "$suiteUUID", "title": "System Check", "fullFile": "", "file": "", "beforeHooks": [], "afterHooks": [], "tests": [ { "title": "Report Placeholder", "fullTitle": "System Check Report Placeholder", "timedOut": false, "duration": 100, "state": "passed", "speed": "fast", "pass": true, "fail": false, "pending": false, "context": null, "code": "true", "err": {}, "uuid": "$testUUID", "parentUUID": "$suiteUUID", "isHook": false, "skipped": false } ], "suites": [], "passes": ["$testUUID"], "failures": [], "pending": [], "skipped": [], "duration": 100, "root": false, "rootEmpty": false, "_timeout": 2000 } ],
            "meta": { "mocha": { "version": "7.0.0" }, "mochawesome": { "options": { "quiet": false, "reportFilename": "mochawesome", "saveHtml": false, "saveJson": true, "consoleReporter": "spec", "useInlineDiffs": false, "code": true }, "version": "7.1.3" }, "marge": { "options": { "reportDir": "cypress/reports/json_logs", "overwrite": false, "html": false, "json": true }, "version": "6.2.0" } }
          }
          "@
          $dummyContent | Out-File -FilePath "$dir/dummy.json" -Encoding UTF8

      - name: Cypress Run
        id: cypress
        env:
          CYPRESS_BASE_URL: "https://10.10.54.51:18443/logcatch"
          CYPRESS_API_URL: "http://10.10.54.5:1234/"
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 👇 [추가] 보안 인증서 경고를 무시하고 접속을 허용합니다.
          NODE_TLS_REJECT_UNAUTHORIZED: 0
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          # 2. 11번 파일을 찾아서 아예 삭제 ("*11_Dev_Basic*" 시작하는 파일들 이 러너 환경에서만 삭제됨 )
          Get-ChildItem -Path "cypress/e2e/Basic_functions_Dev_check" -Recurse | Where-Object { $_.Name -like "*11_Dev_Basic*" } | Remove-Item -Force
          Write-Host "✅ 11_Basic 운영 태스크 파일을 물리적으로 제거하여 실행에서 제외했습니다."
          
          npm install
          npm install cy2 mochawesome mochawesome-merge mochawesome-report-generator --save-dev
          npx cypress install

          # 스펙 경로를 Dev_Check 폴더로 변경하고 따옴표 처리를 안전하게 수정했습니다.
          # $specPath = "cypress/e2e/UI_Module_Dev_Check/**/*.cy.js"
          # 수정된 부분: 중괄호를 사용하여 두 폴더의 모든 .cy.js 파일을 실행 대상으로 잡습니다.
          $specPath = "cypress/e2e/{UI_Module_Dev_Check,Basic_functions_Dev_check}/**/*.cy.js"

          cmd /c "chcp 65001 & npx cy2 run --record --spec $specPath --browser chrome --parallel --ci-build-id ${{ github.ref_name }}-${{ github.run_id }}-UI 2>&1" | Out-File -FilePath cypress.log -Encoding UTF8
          Get-Content cypress.log

      - name: Extract Dashboard URL
        if: always()
        run: |
          $logPath = "cypress.log"
          if (Test-Path $logPath) {
            $content = Get-Content $logPath -Raw -Encoding UTF8
            if ($content -match "(/run/[a-zA-Z0-9-]+)") {
                $runPath = $matches[1]
                $realUrl = "http://10.10.54.5:8080$runPath"
                Write-Host "✅ 대시보드 URL 생성 완료: $realUrl"
                echo $realUrl | Out-File -FilePath run_url.txt -Encoding UTF8
            } else {
                Write-Host "⚠️ 로그에서 Run ID를 찾을 수 없습니다."
                echo "http://10.10.54.5:8080/projects" | Out-File -FilePath run_url.txt -Encoding UTF8
            }
          } else { Write-Host "❌ cypress.log 파일이 없습니다." }

      - name: Upload URL File
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-url-${{ matrix.containers }}
          path: run_url.txt
          retention-days: 1
          if-no-files-found: ignore

      - name: 📂 리포트 데이터 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dev-Raw-Data-${{ matrix.containers }}
          path: |
            cypress/reports/json_logs
            cypress/screenshots
          retention-days: 1
          if-no-files-found: ignore

# ====================================================
  # [Job 2-1] 태스크 재시작 테스트 (단독 실행)
  # ====================================================
  restart-task-run:
    needs: cypress-run  # Job 1이 끝나야 시작
    if: always()        
    runs-on: [self-hosted, PC-Auto]
    # 👇 [추가] cy2 실행을 위한 환경 변수 복사
    env:
      CYPRESS_BASE_URL: "https://10.10.54.51:18443/logcatch" # 💡 필수 추가
      CYPRESS_API_URL: "http://10.10.54.5:1234/"
      CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COMMIT_INFO_MESSAGE: ${{ github.event.head_commit.message }}
      NODE_TLS_REJECT_UNAUTHORIZED: 0                       # 💡 보안 경고 무시
      NO_COLOR: 1
      CI: true
      continue-on-error: true # 에러가 나도 업로드는 해야 함
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress Run (Restart Task Spec)
        run: |
          # 1. 초기 설정 및 설치
          $ErrorActionPreference = "Continue" 
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          npm install --no-audit  
          npx cypress install

          # 파일을 찾지 말고, 경로를 직접 변수에 담습니다. ("*11_Dev_Basic*"" 으로 시작하는 파일들 실행 만약 특정파일 한개라면 "*11_Dev_Basic*운영_태스크*" 한글깨짐)
          $targetSpec = Get-ChildItem -Path "Basic_functions_Dev_check" -Recurse | Where-Object { $_.Name -like "*11_Dev_Basic*" } | Select-Object -ExpandProperty FullName
          
          if (-not $targetSpec) {
              Write-Error "❌ 테스트 파일을 찾을 수 없습니다! 경로를 다시 확인해주세요."
              exit 1
          }

          Write-Host "🚀 [Job 2] 단독 실행 파일: $targetSpec"

          # 실행 시 변수를 따옴표로 감싸서 공백/한글 이슈 방지
          cmd /c "chcp 65001 & npx cy2 run --record --spec `"$targetSpec`" --browser chrome --group 'Restart-Job' --ci-build-id ${{ github.ref_name }}-${{ github.run_id }}-Basic 2>&1" | Out-File -FilePath cypress_restart.log -Encoding UTF8
         
          Get-Content cypress_restart.log
          
      - name: 📂 리포트 데이터 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Restart-Raw-Data # 💡 일반 테스트 아티팩트와 이름 구분
          path: |
            cypress/reports/json_logs
            cypress/screenshots
          retention-days: 1
          if-no-files-found: ignore   


  # ====================================================
  # [Job 3] 종합 알림 (데이터 통합 & 리포트 생성)
  # ====================================================
  notify-result:
    needs: [cypress-run, restart-task-run] # 💡 두 Job이 모두 끝나야 실행
    if: always()
    runs-on: [self-hosted, PC-Auto]
    
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      - name: 🧹 기존 데이터 청소 (Clean Workspace)
        run: |
          Write-Host "이전 작업의 잔여 데이터를 삭제합니다..."
          Remove-Item -Path "all_raw_data" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "final_report_UI" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "downloaded_url" -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Clear Finish!"

      - name: Get Current Time
        run: echo "NOW=$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download Dashboard URL
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: dashboard-url-*
          merge-multiple: true
          path: downloaded_url

      - name: Download All Raw Data
        uses: actions/download-artifact@v4
        with:
          pattern: "*-Raw-Data*" # 💡 Dev-Raw-* 와 Restart-Raw-Data를 모두 통합 다운로드
          path: all_raw_data
          merge-multiple: true
          
      - name: 🔍 파일 구조 확인
        run: Get-ChildItem -Path all_raw_data -Recurse       

      - name: 🔄 리포트 하나로 통합하기
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          npm install mochawesome-merge mochawesome-report-generator --no-save
          cmd /c "npx mochawesome-merge all_raw_data/**/*.json > merged_report.json"
          npx marge merged_report.json --reportDir ./final_report_UI --inline --charts --reportTitle "UI Check Report" --reportFilename "LogCatch_UI_Report" --saveJson=false

      - name: Send Google Chat (UI)
        if: always() 
        env:
          JOB_STATUS: ${{ needs.cypress-run.result }}
          MSG_SUCCESS: "*[성공]*[Auto-PC]"
          MSG_FAIL: "*[실패]*[Auto-PC]"
          MSG_TITLE: "확인결과"
          LABEL_DASH: "대시보드"
          LABEL_GIT: "GitHub(Report)"
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          
          $jobStatus = "${{ env.JOB_STATUS }}".ToLower()
          $reportFolder = "all_raw_data/reports/json_logs"
          $screenshotPath = "all_raw_data/screenshots"
          
          $isActuallyFailed = $false
          $finalFailCount = 0
          $realFailedSpecs = @()

          if (Test-Path $screenshotPath) {
              $failedScreenshots = Get-ChildItem -Path $screenshotPath -Recurse -Filter "*(failed)*.png"
              if ($failedScreenshots.Count -gt 0) {
                  $isActuallyFailed = $true
                  $potentialFailSpecs = $failedScreenshots | ForEach-Object { Split-Path $_.Directory -Leaf } | Select-Object -Unique
                  
                  if (Test-Path $reportFolder) {
                      foreach ($specName in $potentialFailSpecs) {
                          $isRealFail = $false
                          $relatedReports = Get-ChildItem -Path $reportFolder -Filter "report_*.json"
                          foreach ($report in $relatedReports) {
                              try {
                                  $rawJson = Get-Content $report.FullName -Raw -Encoding UTF8
                                  if ([string]::IsNullOrWhiteSpace($rawJson)) { continue }
                                  $content = $rawJson | ConvertFrom-Json -ErrorAction Stop
                                  if ($content.results[0].fullFile -like "*$specName*" -and [int]$content.stats.failures -gt 0) {
                                      $isRealFail = $true
                                      break
                                  }
                              } catch { continue }
                          }
                          if ($isRealFail) { $realFailedSpecs += $specName }
                      }
                  } else { $realFailedSpecs = $potentialFailSpecs }
              }
          }

          if ($isActuallyFailed) {
              $finalFailCount = $realFailedSpecs.Count
              if ($finalFailCount -eq 0 -and $jobStatus -ne "success") {
                  $finalFailCount = 1
                  $realFailedSpecs = @("Detected by System")
              }
          }

          # 상태 결정
          if ($isActuallyFailed -and $finalFailCount -gt 0) {
              $title = $env:MSG_FAIL
              $fileNameString = if ($realFailedSpecs.Count -gt 0) { $realFailedSpecs -join ", " } else { "Unknown Spec" }
              $statusDetail = "FAIL: $finalFailCount script ( $fileNameString )"
              "FINAL_STATUS=FAIL" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
              $title = $env:MSG_SUCCESS
              $statusDetail = ""
              "FINAL_STATUS=PASS" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

          # 메시지 조립 (Here-String 방식으로 따옴표 에러 방지)
          $pName = $env:PRODUCT_NAME
          $tType = $env:TEST_TYPE
          $mTitle = $env:MSG_TITLE
          $time = $env:NOW
          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $url = if (Test-Path "downloaded_url/run_url.txt") { (Get-Content "downloaded_url/run_url.txt" -Raw).Trim() } else { "http://10.10.54.5:8080/projects" }

          # 👇 여기가 에러가 났던 부분입니다. 구조를 완전히 안전하게 바꿨습니다.
          $msgBody = @"
          $title $pName $tType $mTitle ($time)
          $statusDetail

          ${env:LABEL_DASH} : $url
          ${env:LABEL_GIT} : $runUrl
          "@

          $payload = @{ text = $msgBody } | ConvertTo-Json -Compress
          $utf8Payload = [System.Text.Encoding]::UTF8.GetBytes($payload)
          Invoke-RestMethod -Uri '${{ secrets.GOOGLE_CHAT_WEBHOOK }}' -Method Post -ContentType "application/json; charset=utf-8" -Body $utf8Payload