name: Auto-PC Work (Daily_Depth)

env:
  PRODUCT_NAME: "로그캐치"
  #실패시 파일명 독립적으로 명시하기위해 꼬리표
  TEST_TYPE: 기능(Depth)
  TZ: Asia/Seoul
  # 👇 여기에 추가하세요! (GitHub Actions가 내부적으로 Node.js 24를 사용하도록 강제함)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "master" ]
  schedule:
    - cron: '45 3 * * 1-5'
  workflow_dispatch:

jobs:
  # ====================================================
  # [Job 1] 테스트 실행 (Runner)
  # ====================================================
  cypress-run:
    runs-on: [self-hosted, PC-Auto]
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2, 3, 4, 5] # 5병렬 runner추가

    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

        # 👇 [추가] 이전 테스트 결과 찌꺼기(HTML 등) 삭제
      - name: Clean Previous Reports
        run: | 
          Remove-Item -Path "cypress/reports" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "cypress/screenshots" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "cypress/videos" -Recurse -Force -ErrorAction SilentlyContinue


      - name: Get Current Time
        run: echo "NOW=$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # 👇 [안전장치] 파일이 없어서 에러나는 것 방지용 빈 파일 생성
      - name: Create Dummy Report File
        run: |
          # 👇 경로를 config와 맞춤
          $dir = "cypress/reports/json_logs"
          if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Force -Path $dir }
          # 👇 [핵심 수정] 가짜 문자열 대신 '진짜 UUID'를 생성합니다.
          $suiteUUID = [guid]::NewGuid().ToString()
          $testUUID  = [guid]::NewGuid().ToString()
          
          # 리포트 생성기가 좋아하는 완벽한 데이터 구조
          $dummyContent = @"
          {
            "stats": {
              "suites": 1,
              "tests": 1,
              "passes": 1,
              "pending": 0,
              "failures": 0,
              "start": "2024-01-01T00:00:00.000Z",
              "end": "2024-01-01T00:00:01.000Z",
              "duration": 100,
              "testsRegistered": 1,
              "passPercent": 100,
              "pendingPercent": 0,
              "other": 0,
              "hasOther": false,
              "skipped": 0,
              "hasSkipped": false
            },
            "results": [
              {
                "uuid": "$suiteUUID",
                "title": "System Check",
                "fullFile": "",
                "file": "",
                "beforeHooks": [],
                "afterHooks": [],
                "tests": [
                  {
                    "title": "Report Placeholder",
                    "fullTitle": "System Check Report Placeholder",
                    "timedOut": false,
                    "duration": 100,
                    "state": "passed",
                    "speed": "fast",
                    "pass": true,
                    "fail": false,
                    "pending": false,
                    "context": null,
                    "code": "true",
                    "err": {},
                    "uuid": "$testUUID",
                    "parentUUID": "$suiteUUID",
                    "isHook": false,
                    "skipped": false
                  }
                ],
                "suites": [],
                "passes": ["$testUUID"],
                "failures": [],
                "pending": [],
                "skipped": [],
                "duration": 100,
                "root": false,
                "rootEmpty": false,
                "_timeout": 2000
              }
            ],
            "meta": {
              "mocha": { "version": "7.0.0" },
              "mochawesome": {
                "options": {
                  "quiet": false,
                  "reportFilename": "mochawesome",
                  "saveHtml": false,
                  "saveJson": true,
                  "consoleReporter": "spec",
                  "useInlineDiffs": false,
                  "code": true
                },
                "version": "7.1.3"
              },
              "marge": {
                "options": {
                  "reportDir": "cypress/reports/json_logs",
                  "overwrite": false,
                  "html": false,
                  "json": true
                },
                "version": "6.2.0"
              }
            }
          }
          "@
          
          $dummyContent | Out-File -FilePath "$dir/dummy.json" -Encoding UTF8
         
         
          

      - name: Cypress Run
        id: cypress
        env:
          CYPRESS_API_URL: "http://10.10.54.5:1234/"
          CYPRESS_RECORD_KEY: "my-secret-key"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_INFO_MESSAGE: ${{ github.event.head_commit.message }}
          NO_COLOR: 1
          CI: true
          # 👇 아래 두 줄을 추가하세요! (계정권한 부족 문제 해결)
          CYPRESS_CACHE_FOLDER: ${{ github.workspace }}\.cypress-cache
          TEMP: ${{ github.workspace }}\.temp
        # continue-on-error: true # 에러가 나도 업로드는 해야 함
        run: |
          # 1. 인코딩 강제 설정 (한글 파일명 인식용)
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          
          # 2. 11번 파일을 찾아서 아예 삭제 ("*11_Depth*" 시작하는 파일들 이 러너 환경에서만 삭제됨 )
          Get-ChildItem -Path "cypress/e2e/Depth_functions_check" -Recurse | Where-Object { $_.Name -like "*11_Depth*" } | Remove-Item -Force
          Write-Host "✅ [Job 1] 운영 태스크 파일을 물리적으로 제거하여 실행에서 제외했습니다."

          # 2.5 Cypress Binary 설치 (캐시 경로에 파일이 없을 경우 대비)
          Write-Host "🚀 Cypress Binary 설치 확인 중..."
          npx cypress install

          # 3. 실행
          cmd /c "chcp 65001 & npx cy2 run --record --spec 'cypress/e2e/Depth_functions_check/**/*.cy.js' --browser chrome --parallel --group 'Main-Tests' --ci-build-id ${{ github.ref_name }}-${{ github.run_id }}-Depth 2>&1" | Out-File -FilePath cypress.log -Encoding UTF8
          
          Get-Content cypress.log

      - name: Extract Dashboard URL
        if: always()
        run: |
          $logPath = "cypress.log"

          if (Test-Path $logPath) {
            # 로그 파일 전체 내용을 읽어옵니다.
            $content = Get-Content $logPath -Raw -Encoding UTF8
            
            # 👇 [최적화] 전체 URL이 아니라, 변하지 않는 뒷부분 "/run/ID" 패턴만 찾습니다.
            # (ID에 알파벳, 숫자, 하이픈(-)이 섞여 있어도 다 찾아냅니다)
            if ($content -match "(/run/[a-zA-Z0-9-]+)") {
                $runPath = $matches[1]  # 예: /run/fd8ece14f001...
                
                # 👇 앞부분은 우리가 원하는 '진짜 IP'로 고정해서 붙입니다.
                $realUrl = "http://10.10.54.5:8080$runPath"
                
                Write-Host "✅ 대시보드 URL 생성 완료: $realUrl"
                echo $realUrl | Out-File -FilePath run_url.txt -Encoding UTF8
            } else {
                Write-Host "⚠️ 로그에서 Run ID를 찾을 수 없습니다."
                # 실패 시 프로젝트 목록 페이지로 안내
                echo "http://10.10.54.5:8080/projects" | Out-File -FilePath run_url.txt -Encoding UTF8
            }
          } else {
             Write-Host "❌ cypress.log 파일이 없습니다."
          }

      - name: Upload URL File
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-url-${{ matrix.containers }}
          path: run_url.txt
          retention-days: 1
          if-no-files-found: ignore

      # 👇 [수정됨] 경로를 'cypress/reports' 전체로 변경하여 파일 누락 방지
      - name: 📂 리포트 데이터 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Depth-Raw-Data-${{ matrix.containers }}
          path: |
            cypress/reports/json_logs
            cypress/screenshots
          retention-days: 1
          if-no-files-found: ignore
  
  # ====================================================
  # [Job 2] 태스크 재시작 테스트 (단독 실행)
  # ====================================================
  restart-task-run:
    needs: cypress-run  # Job 1이 끝나야 시작
    if: always()        
    runs-on: [self-hosted, PC-Auto]
    # 👇 [추가] cy2 실행을 위한 환경 변수 복사
    env:
      CYPRESS_API_URL: "http://10.10.54.5:1234/"
      CYPRESS_RECORD_KEY: "my-secret-key"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COMMIT_INFO_MESSAGE: ${{ github.event.head_commit.message }}
      NO_COLOR: 1
      CI: true
      # continue-on-error: true # 에러가 나도 업로드는 해야 함
       # 👇 아래 두 줄을 추가하세요! (계정권한 부족 문제 해결)
      CYPRESS_CACHE_FOLDER: ${{ github.workspace }}\.cypress-cache
      TEMP: ${{ github.workspace }}\.temp
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress Run (Restart Task Spec)
        run: |
          # 1. 초기 설정 및 설치
          $ErrorActionPreference = "Continue" 
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          npm install --no-audit  
          npx cypress install

          # 2. 💡 파일 존재 여부 체크 및 예외 처리 보완
          # 경로가 'cypress/e2e/Depth_functions_check' 인지 다시 한번 확인하세요.
          $targetFile = Get-ChildItem -Path "cypress/e2e/Depth_functions_check" -Recurse | 
                        Where-Object { $_.Name -like "*11_Depth*" } | 
                        Select-Object -First 1

          if (-not $targetFile) {
              # 💡 에러 대신 'SKIP' 메시지를 남기고 성공(exit 0)으로 종료합니다.
              Write-Host "⚠️ [SKIP] 실행할 테스트 파일(*11_Depth*)이 폴더에 존재하지 않습니다."
              Write-Host "👉 Job 1(cypress-run)에서 이미 삭제되었거나 경로가 다를 수 있습니다. 작업을 건너뜁니다."
              exit 0 
          }

          # 파일이 있을 경우에만 아래 로직 실행
          $targetSpec = $targetFile.FullName
          Write-Host "🚀 [Job 2] 단독 실행 파일: $targetSpec"

          # 실행 시 변수를 따옴표로 감싸서 공백/한글 이슈 방지
          cmd /c "chcp 65001 & npx cy2 run --record --spec `"$targetSpec`" --browser chrome --group 'Restart-Job' --ci-build-id ${{ github.ref_name }}-${{ github.run_id }}-Depth 2>&1" | Out-File -FilePath cypress_restart.log -Encoding UTF8
         
          Get-Content cypress_restart.log
          
      - name: 📂 리포트 데이터 업로드 (Restart Spec)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Depth-Raw-Data-Restart
          path: |
            **/reports/json_logs/*.json
            **/screenshots/**/*.png
          retention-days: 1
          # 💡 [필수] 파일이 없을 때(Skip 시) 에러나 경고를 내지 않도록 설정
          if-no-files-found: ignore       

  # ====================================================
  # [Job 3] 종합 알림 (데이터 통합 & 리포트 생성)
  # ====================================================
  notify-result:
    #needs: cypress-run
    needs: [cypress-run, restart-task-run] # 두 작업이 모두 끝나야 함
    if: always()
    runs-on: [self-hosted, PC-Auto]
    
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -Command "{0}"

    steps:
      # 👇 [필수 추가] 이 단계가 없으면 이전 테스트 결과(Depth)와 현재 결과(UI)가 뒤섞입니다!
      - name: 🧹 기존 데이터 청소 (Clean Workspace)
        run: |
          Write-Host "이전 작업의 잔여 데이터를 삭제합니다..."
          Remove-Item -Path "all_raw_data" -Recurse -Force -ErrorAction SilentlyContinue
          # 👇 [수정] final_report_Depth 폴더를 청소
          Remove-Item -Path "final_report_Depth" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "downloaded_url" -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host "Clear Finish!"

      - name: Get Current Time
        run: echo "NOW=$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download Dashboard URL
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: dashboard-url-* # 1, 2, 3번 모두 찾음
          merge-multiple: true     # 파일 이름이 같으므로(run_url.txt) 하나로 합쳐짐 (덮어쓰기)
          path: downloaded_url

      # 모든 Raw 데이터 다운로드
      - name: Download All Raw Data
        uses: actions/download-artifact@v4
        with:
          pattern: Depth-Raw-Data-*
          path: all_raw_data
          merge-multiple: true

      # 👇 [추가됨] 파일이 진짜 있는지 눈으로 확인 (디버깅용)
      - name: 🔍 파일 구조 확인
        run: Get-ChildItem -Path all_raw_data -Recurse    

      # 👇 [통합 로직] 폴더 구조가 바뀌어도 찾을 수 있게 **/*.json 사용
      - name: 🔄 리포트 하나로 통합하기
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          npm install mochawesome-merge mochawesome-report-generator --no-save

          # 1. JSON 파일 병합 (가장 넓은 범위로 탐색)
          cmd /c "npx mochawesome-merge all_raw_data/**/*.json > merged_report.json"
          
          # 2. HTML 생성
          # 여기에 --reportFilename "LogCatch_Depth_fun_Report" 추가
          npx marge merged_report.json --reportDir ./final_report_Depth --inline --charts --reportTitle "Depth Function Report" --reportFilename "LogCatch_Depth_fun_Report" --saveJson=false

      - name: Send Google Chat (Depth)
        if: always() 
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          CYPRESS_STATUS: ${{ needs.cypress-run.result }}
          # Depth에 restart-task-run이 없다면 이 줄은 무시되지만, 필요하다면 유지
          RESTART_STATUS: ${{ needs.restart-task-run.result }}
          PRODUCT_NAME: "로그캐치"
          TEST_TYPE: "Depth"
          # 👇 원하시는 버전명을 직접 하드코딩해서 입력하세요!
          HARDCODED_VERSION: "3.0.5.0_r34908" 
          MSG_SUCCESS: "*[성공]*[Auto-PC]"
          MSG_FAIL: "*[실패]*[Auto-PC]"
          MSG_TITLE: "시나리오 확인결과"
          LABEL_DASH: "대시보드"
          LABEL_GIT: "GitHub(Report)"
          NOW: ${{ env.NOW }}

        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          
          $failedSpecNames = @()
          $isActuallyFailed = $false
          $totalFailCount = 0

          Write-Host "============= [🔍 데이터 정밀 분석 시작 (Flaky 완벽 방어)] ============="

          # [Step 1] 개별 JSON 리포트 전수 조사 
          # 💡 [핵심 차단 1] merged_report.json은 전체 파일명이 다 들어있으므로 탐색에서 무조건 제외!
          $jsonFiles = Get-ChildItem -Path "all_raw_data" -Recurse -Filter "*.json" -ErrorAction SilentlyContinue | Where-Object { $_.Name -ne "merged_report.json" }
          
          foreach ($file in $jsonFiles) {
              try {
                  $rawContent = Get-Content $file.FullName -Raw -Encoding UTF8
                  $content = $rawContent | ConvertFrom-Json
                  
                  # 💡 [핵심 차단 2] 개별 리포트에 실패가 기록되어 있을 때만 "진짜 실패"로 간주!
                  if ($content.stats -and [int]$content.stats.failures -gt 0) {
                      $isActuallyFailed = $true
                      $totalFailCount += [int]$content.stats.failures
                      
                      # 이 파일은 진짜 실패한 파일이므로 안심하고 파일명 추출
                      $fileMatches = [regex]::Matches($rawContent, '(?<="file":\s*")[^"]+\.cy\.js|(?<="fullFile":\s*")[^"]+\.cy\.js')
                      foreach ($match in $fileMatches) {
                          $fName = Split-Path ($match.Value -replace '\\', '/') -Leaf
                          if ($fName) { $failedSpecNames += $fName }
                      }
                  }
              } catch {}
          }

          # [Step 2] Job 자체 상태 확인 (시스템 크래시 대비)
          $cyStatus = "${{ env.CYPRESS_STATUS }}".ToLower()
          $restartStatus = "${{ env.RESTART_STATUS }}".ToLower()
          if ($cyStatus -eq "failure" -or $cyStatus -eq "cancelled" -or $restartStatus -eq "failure" -or $restartStatus -eq "cancelled") {
              $isActuallyFailed = $true
          }

          # 중복 제거 및 1차 필터링
          $uniqueFailures = $failedSpecNames | Where-Object { $_ -match "\.cy\.js$" } | Select-Object -Unique

          # [Step 3] 스크린샷 물리 경로 추적 (최후의 보루)
          # 💡 [핵심 차단 3] JSON에서 진짜 실패한 파일명을 이미 찾았다면(Count > 0), 스크린샷은 절대 뒤지지 않습니다!
          if ($isActuallyFailed -and $uniqueFailures.Count -eq 0) {
              $failedScreenshots = Get-ChildItem -Path "all_raw_data" -Recurse -Filter "*failed*.png" -ErrorAction SilentlyContinue
              if ($failedScreenshots.Count -gt 0) {
                  foreach ($shot in $failedScreenshots) {
                      $shotMatches = [regex]::Matches($shot.FullName, '([^\\/":*?<>|]+\.cy\.js)')
                      foreach ($m in $shotMatches) { $failedSpecNames += $m.Value.Trim() }
                  }
                  # 스크린샷에서 찾은 값으로 다시 중복 제거
                  $uniqueFailures = $failedSpecNames | Where-Object { $_ -match "\.cy\.js$" } | Select-Object -Unique
              }
          }

          # [Step 4] 대시보드 URL 탐색
          $dashUrl = "http://10.10.54.5:8080/projects"
          $urlFiles = Get-ChildItem -Path "all_raw_data", "downloaded_url" -Recurse -Filter "run_url.txt" -ErrorAction SilentlyContinue
          foreach ($uFile in $urlFiles) {
              $tempUrl = (Get-Content $uFile.FullName -Raw -Encoding UTF8).Trim()
              if ($tempUrl -match "http" -and $tempUrl -notmatch "projects$") {
                  $dashUrl = $tempUrl
                  break
              }
          }

          # [Step 5] 메시지 조립
          $time = "$env:NOW"
          if ($isActuallyFailed) {
              "FINAL_STATUS=FAIL" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              $title = $env:MSG_FAIL.Replace("[실패]", "*[실패]*") + " $($env:PRODUCT_NAME) $($env:TEST_TYPE) $($env:MSG_TITLE) (v$($env:HARDCODED_VERSION))"
              
              $count = if ($totalFailCount -gt 0) { $totalFailCount } elseif ($uniqueFailures.Count -gt 0) { $uniqueFailures.Count } else { 1 }
              $specListString = if ($uniqueFailures.Count -gt 0) { $uniqueFailures -join ", " } else { "System Error or Crash" }
              
              $statusDetail = "FAIL: $count script ( $specListString )"
          } else {
              "FINAL_STATUS=PASS" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              $title = $env:MSG_SUCCESS.Replace("[성공]", "*[성공]*") + " $($env:PRODUCT_NAME) $($env:TEST_TYPE) $($env:MSG_TITLE) (v$($env:HARDCODED_VERSION))"
              $statusDetail = ""
          }

          $runUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # 메시지 라인 생성
          $msgLines = @()
          if ($isActuallyFailed) {
              $msgLines += "$title"
              $msgLines += "($time)"
              $msgLines += "$statusDetail"
          } else {
              $msgLines += "$title"
              $msgLines += "($time)"
          }
          $msgLines += ""
          $msgLines += "$($env:LABEL_DASH) : $dashUrl"
          $msgLines += "$($env:LABEL_GIT) : $runUrl"

          # 전송
          $payload = @{ text = ($msgLines -join "`n") } | ConvertTo-Json -Compress
          $utf8Bytes = [System.Text.Encoding]::UTF8.GetBytes($payload)
          Invoke-RestMethod -Uri "$env:WEBHOOK_URL" -Method Post -ContentType "application/json; charset=utf-8" -Body $utf8Bytes

      - name: 🚨 실패 시 팀원 전체에게 긴급 메일 발송
        if: always() && env.FINAL_STATUS == 'FAIL'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
