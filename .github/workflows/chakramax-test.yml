name: ChakraMax UI Test

env:
 FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * 1-5'   # 매일 KST 07:00 (UTC 22:00)

jobs:
  run-squish-tests:
    runs-on: [self-hosted, ChakramaxAuto]   # ORANGEWEB 러너의 라벨 지정

    steps:
      - name: Checkout test suite
        uses: actions/checkout@v5

      # 1. 리포트를 저장할 폴더 미리 생성
      - name: Create Results Directory
        run: |
          New-Item -ItemType Directory -Force -Path "results"
        shell: powershell

      - name: Start Squish Server
        run: |
          Start-Process -FilePath "C:\Users\Orange\Squish for Windows 9.2.2\bin\squishserver.exe" -ArgumentList "--verbose"
          Start-Sleep -Seconds 5
        shell: powershell

      # 2. Client 테스트 실행 (파일명 교정 및 실패 시에도 진행 설정)
      - name: Run tst_test_chakramax_Client
        run: |
          & "C:\Users\Orange\Squish for Windows 9.2.2\bin\squishrunner.exe" `
            --testsuite ".\suite_TEST_QA" `
            --testcase "tst_test_chakramax_Client" `
            --reportgen junit,results\chakramax_client_result.xml
        shell: powershell

      # 3. Manager 테스트 실행
      - name: Run tst_test_chakramax_manager
        run: |
          & "C:\Users\Orange\Squish for Windows 9.2.2\bin\squishrunner.exe" `
            --testsuite ".\suite_TEST_QA" `
            --testcase "tst_test_chakramax_manager" `
            --reportgen junit,results\chakra_manager_result.xml
        shell: powershell

      - name: Publish Test Report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'results/*.xml'

      - name: Stop Squish Server
        if: always()
        run: |
          Stop-Process -Name "squishserver" -Force -ErrorAction SilentlyContinue
        shell: powershell