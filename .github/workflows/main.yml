name: Cypress Tests

# 여기에 제품 이름을 적어두면, 아래 모든 단계에서 이 이름을 갖다 씁니다.
env:
  PRODUCT_NAME: "로그캐치"  # 나중에 "다른제품"으로 여기만 바꾸면 됩니다.

# 언제 실행할까요? (코드가 push 될 때마다)
on:
  push:             # 코드가 올라올 때 실행
      branches: [ "master" ]  # 👈 [핵심] master 브랜치에 올릴 때만 자동 실행!
  schedule:
    - cron: '0 1 * * 1-5'  # 월~금 오전 10시(한국시간)에 자동 실행
  # - cron: '25 2 * * 1-5'  # 월~금 오전 11:25(한국 11:25 = UTC 02:25)
  # - cron: '0 7 * * 1-5'   # 월~금 오후 16:00 (UTC 08:00) 
  # - cron: '0 1 * * *'    # 매일 한국 오전 10시 (UTC 01시)
  workflow_dispatch:      # 이 한 줄만 추가하세요!
jobs:
  cypress-run:
    #runs-on: ubuntu-latest # 리눅스 서버 대여
    runs-on: self-hosted    # <--- 내 컴퓨터 (회사망 접속 가능 ⭕)
    steps:
      - name: Checkout # 내 코드 가져오기
        uses: actions/checkout@v4

      - name: Cypress Run # 사이프러스 실행
        uses: cypress-io/github-action@v6
        with:
          # Cypress Cloud로 기록 전송 (그래야 대시보드에서 볼 수 있음)
          record: true
          browser: chrome   # 👈 [추가] 이 줄을 넣어주세요!
        env:
          # 아까 3단계에서 저장한 비밀키를 여기서 몰래 가져옵니다
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          # 깃허브 토큰은 자동으로 제공됩니다 (따로 설정 안 해도 됨)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ▼▼▼ 기존 코드 아래에 이어서 붙여넣으세요 ▼▼▼

      - name: Send Google Chat Notification
        if: always()
        run: |
          # 1. [중요] 한글 깨짐 방지를 위한 인코딩 강제 설정
          [Console]::OutputEncoding = [Text.UTF8Encoding]::UTF8

          $status = "${{ job.status }}"
          
          # 이모지 대신 안전한 텍스트 사용
          if ($status -eq 'success') { 
            $resultTitle = "[성공]" 
          } else { 
            $resultTitle = "[실패]" 
          }
          
          # 기존: "$resultTitle Cypress Test Result: $status`nLink: ..."
          # 변경: "$resultTitle 로그캐치UI확인 결과`nLink: ..."
          $message = "$resultTitle $env:PRODUCT_NAME UI확인 결과`nLink: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          # JSON 변환 및 구글챗 전송
          # 2. [핵심 변경] JSON 텍스트를 "UTF-8 바이트 배열"로 강제 변환
          $payload = @{ text = $message } | ConvertTo-Json -Compress
          $payloadBytes = [System.Text.Encoding]::UTF8.GetBytes($payloadJson)

          # 2. [핵심] 한글 전송할 때 UTF-8임을 명시 (여기가 수정되었습니다!)
          Invoke-RestMethod -Uri "${{ secrets.GOOGLE_CHAT_WEBHOOK }}" -Method Post -ContentType "application/json; charset=utf-8" -Body $payload