name: Cypress Tests

env:
  PRODUCT_NAME: "로그캐치"
  TZ: Asia/Seoul

on:
  push:
    branches: [ "master" ]
  schedule:
    - cron: '15 2 * * 1-5' # 월~금 오전 11:15 (KST)
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: [self-hosted, PC-YHJIN]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 한국 시간 구해서 환경변수(NOW)에 저장
      - name: Get Current Time (KST)
        shell: powershell
        run: |
          $korea_time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          echo "NOW=$korea_time" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # 👇 [핵심 변경] 공식 액션 대신 'cy2' 명령어로 직접 실행 (로컬 대시보드 전송)
      - name: Cypress Run (Self-Hosted Dashboard)
        shell: powershell
        env:
          # PC-YHJIN(현재 PC)에 대시보드가 있으므로 localhost 사용
          CYPRESS_API_URL: "http://10.10.54.1:1234/"
          CYPRESS_RECORD_KEY: "my-secret-key" # 아무거나 입력
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 👇 [추가됨] 대시보드에 커밋 정보를 표시하기 위한 설정 (여기 4줄 추가!)
          COMMIT_INFO_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_INFO_AUTHOR: ${{ github.actor }}
          COMMIT_INFO_SHA: ${{ github.sha }}
          COMMIT_INFO_BRANCH: ${{ github.ref_name }}
        run: |
          # 1. 의존성 설치
          npm install
          
          # 2. cy2 도구 설치 (안전장치)
          npm install cy2 --save-dev

          # 👇 [추가] Cypress 실행 파일이 없으면 강제로 설치하는 명령어
          npx cypress install

          # 3. 테스트 실행 (중복 실행 방지를 위해 Build ID에 실행 번호 포함)
          # npx cy2 run --record --browser chrome --ci-build-id "github-run-${{ github.run_id }}"
          # 👇 중간에 --parallel 옵션이 추가되었습니다.
          #npx cy2 run --record --browser chrome --parallel --ci-build-id "github-run-${{ github.run_id }}"
          # 👇 "github-run" 대신 "${{ github.ref_name }}"을 사용
          npx cy2 run --record --browser chrome --parallel --ci-build-id "${{ github.ref_name }}-${{ github.run_id }}"

      - name: Send Google Chat Notification
        if: always()
        env:
          MSG_SUCCESS: "[성공]"
          MSG_FAIL: "[실패]"
          MSG_TITLE: "UI 확인결과"
          DASH_BASE: "http://10.10.54.1:8080"  # 👈 이 부분이 추가된 버전이어야 합니다.
          # 👇 [추가됨] 한글 깨짐 방지를 위해 여기서 변수로 선언
          LABEL_DASH: "대시보드"
          LABEL_GIT: "GitHub"
        run: |
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          if ("${{ job.status }}" -eq 'success') { 
            $resultTitle = $env:MSG_SUCCESS
          } else { 
            $resultTitle = $env:MSG_FAIL
          }

          # 1. 대시보드 링크 생성
          $dashboardUrl = "$env:DASH_BASE/run/${{ github.ref_name }}-${{ github.run_id }}"
          
          # 2. 메시지 생성 (한글/이모지를 직접 쓰지 않고 변수 $env:LABEL_... 사용)
          $message = "$resultTitle $env:PRODUCT_NAME $env:MSG_TITLE ($env:NOW)`n`n${env:LABEL_DASH}: $dashboardUrl`n${env:LABEL_GIT}: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          Write-Host "생성된 메시지: $message"
          
          $payloadJson = (@{ text = $message } | ConvertTo-Json -Compress -Depth 2)
          $payloadBytes = [System.Text.Encoding]::UTF8.GetBytes($payloadJson)

          Invoke-RestMethod -Uri "${{ secrets.GOOGLE_CHAT_WEBHOOK }}" -Method Post -ContentType "application/json; charset=utf-8" -Body $payloadBytes

      - name: 🚨 실패 시 팀원 전체에게 긴급 메일 발송
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: 🚨 [긴급/실패] Cypress UI 테스트 실패 알림
          to: yhjin@warevalley.com
          from: Cypress 알림 봇 <noreply@warevalley.com>
          body: |
            [긴급] 로그캐치 UI 자동화 테스트가 실패했습니다.
            
            ---------------------------------------------------
            발생 시간: ${{ env.NOW }}
            상태: ❌ FAILED (실패)
            Runner: PC-YHJIN
            대시보드: Local (Sorry-Cypress)
            리포지토리: ${{ github.repository }}
            
            👉 상세 로그 확인 (Link):
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            ---------------------------------------------------
            
            담당자분들은 위 링크를 클릭하여 실패 원인을 확인해 주세요.