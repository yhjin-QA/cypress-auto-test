name: Cypress Tests

env:
  PRODUCT_NAME: "로그캐치"

on:
  push:
    # branches: [ "master" ]  # 👈 주석(#)을 지우면 Master 브랜치에서만 자동 실행됩니다.
  schedule:
    - cron: '0 1 * * 1-5'
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cypress Run
        uses: cypress-io/github-action@v6
        with:
          record: true
          browser: chrome
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Google Chat Notification
        if: always()
        run: |
          # 1. 인코딩 설정
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          $status = "${{ job.status }}"
          
          if ($status -eq 'success') { 
            $resultTitle = "[성공]" 
          } else { 
            $resultTitle = "[실패]" 
          }
          
          $message = "$resultTitle $env:PRODUCT_NAME UI확인 결과`nLink: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          # 디버깅 로그
          Write-Host "생성된 메시지: $message"
          
          # 2. JSON 변환 (괄호로 감싸기)
          $payloadJson = (@{ text = $message } | ConvertTo-Json -Compress -Depth 2)
          
          if ([string]::IsNullOrWhiteSpace($payloadJson)) {
            Write-Error "JSON 변환 실패: 메시지 내용이 비어있습니다."
            exit 1
          }

          # 3. 바이트 변환
          $payloadBytes = [System.Text.Encoding]::UTF8.GetBytes($payloadJson)

          # 4. 전송 (수정됨: $payload -> $payloadBytes)
          Invoke-RestMethod -Uri "${{ secrets.GOOGLE_CHAT_WEBHOOK }}" -Method Post -ContentType "application/json; charset=utf-8" -Body $payloadBytes