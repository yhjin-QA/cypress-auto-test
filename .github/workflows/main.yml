name: Cypress Tests

# 언제 실행할까요? (코드가 push 될 때마다)
on:
  push:             # 코드가 올라올 때 실행
  schedule:
    - cron: '0 1 * * 1-5'  # 월~금 오전 10시(한국시간)에 자동 실행
    - cron: '25 2 * * 1-5'  # 월~금 오전 11:25(한국 11:25 = UTC 02:25)
    - cron: '0 8 * * 1-5'   # 월~금 오후 17:00 (UTC 08:00) 
  # - cron: '0 1 * * *'    # 매일 한국 오전 10시 (UTC 01시)
  workflow_dispatch:      # 이 한 줄만 추가하세요!
jobs:
  cypress-run:
    #runs-on: ubuntu-latest # 리눅스 서버 대여
    runs-on: self-hosted    # <--- 내 컴퓨터 (회사망 접속 가능 ⭕)
    steps:
      - name: Checkout # 내 코드 가져오기
        uses: actions/checkout@v4

      - name: Cypress Run # 사이프러스 실행
        uses: cypress-io/github-action@v6
        with:
          # Cypress Cloud로 기록 전송 (그래야 대시보드에서 볼 수 있음)
          record: true
          browser: chrome   # 👈 [추가] 이 줄을 넣어주세요!
        env:
          # 아까 3단계에서 저장한 비밀키를 여기서 몰래 가져옵니다
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          # 깃허브 토큰은 자동으로 제공됩니다 (따로 설정 안 해도 됨)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ▼▼▼ 기존 코드 아래에 이어서 붙여넣으세요 ▼▼▼

      - name: Send Google Chat Notification
        if: always()
        run: |
          $status = "${{ job.status }}"
          
          # 이모지 대신 안전한 텍스트 사용
          if ($status -eq 'success') { 
            $resultTitle = "[SUCCESS]" 
          } else { 
            $resultTitle = "[FAIL]" 
          }
          
          # 메시지 내용 구성
          $message = "$resultTitle Cypress Test Result: $status`nLink: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          # JSON 변환 및 전송
          $payload = @{ text = $message } | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri "${{ secrets.GOOGLE_CHAT_WEBHOOK }}" -Method Post -ContentType "application/json" -Body $payload