name: Auto-PC Work (Daily)

env:
  PRODUCT_NAME: "로그캐치"
  TZ: Asia/Seoul

on:
  push:
    branches: [ "master" ]
  schedule:
    # 제공해주신 시간 설정 유지 (UTC 1:15, 3:15 -> 한국 10:15, 12:15)
    - cron: '15 1,3 * * 1-5'
  workflow_dispatch:

jobs:
  cypress-run:
    runs-on: [self-hosted, PC-Auto]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 👇 [추가됨] 1. 한국 시간 구해서 환경변수(NOW)에 저장
      - name: Get Current Time (KST)
        shell: pwsh
        run: |
          $korea_time = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          echo "NOW=$korea_time" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cypress Run
        uses: cypress-io/github-action@v6
        with:
          record: true
          browser: chrome
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Google Chat Notification
        if: always()
        env:
          MSG_SUCCESS: "[성공][Auto-PC]"
          MSG_FAIL: "[실패][Auto-PC]"
          MSG_TITLE: "UI 확인결과"
        run: |
          # 1. PowerShell 인코딩 안전장치
          $OutputEncoding = [System.Text.Encoding]::UTF8
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          # 2. 성공/실패 여부에 따라 제목 설정
          if ("${{ job.status }}" -eq 'success') { 
            $resultTitle = $env:MSG_SUCCESS
          } else { 
            $resultTitle = $env:MSG_FAIL
          }
          
          # 👇 [수정됨] 3. 메시지에 시간($env:NOW) 추가
          $message = "$resultTitle $env:PRODUCT_NAME $env:MSG_TITLE ($env:NOW)`nLink: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          # 로그 확인용
          Write-Host "생성된 메시지: $message"
          
          # 4. JSON 변환 및 바이트 배열화
          $payloadJson = (@{ text = $message } | ConvertTo-Json -Compress -Depth 2)
          $payloadBytes = [System.Text.Encoding]::UTF8.GetBytes($payloadJson)

          # 5. 구글챗 전송
          Invoke-RestMethod -Uri "${{ secrets.GOOGLE_CHAT_WEBHOOK }}" -Method Post -ContentType "application/json; charset=utf-8" -Body $payloadBytes

      # 👇 [추가됨] 4. 실패 시 이메일 발송 (main.yml과 동일하게 맞춤)
      - name: 🚨 실패 시 팀원 전체에게 긴급 메일 발송
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          
          subject: 🚨 [긴급/실패][Auto-PC] Cypress UI 테스트 실패 알림
          
          # 수신자 목록
          to: yhjin@warevalley.com
          
          from: Cypress 알림 봇 <noreply@warevalley.com>
          
          body: |
            [긴급] Auto-PC에서 수행된 로그캐치 UI 자동화 테스트가 실패했습니다.
            
            ---------------------------------------------------
            발생 시간: ${{ env.NOW }}
            상태: ❌ FAILED (실패)
            Runner: PC-Auto
            리포지토리: ${{ github.repository }}
            
            👉 상세 로그 확인 (Link):
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            ---------------------------------------------------
            
            담당자분들은 위 링크를 클릭하여 실패 원인을 확인해 주세요.